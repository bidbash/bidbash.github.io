/* The mid-season auction reuses the auction room: same typed bids, auto hammer and gavel. */
function startWindowAuction(wid){
  const D=LG.data, set=Object.assign({},D.league.settings);
  const held=new Set(D.ownership.filter(o=>!o.released&&o.to_round==null).map(o=>o.player_id));
  const released=[...new Set(D.ownership.filter(o=>o.released).map(o=>o.player_id))].filter(p=>!held.has(p));
  const unsold=D.league.players.map(p=>p.id).filter(p=>!held.has(p)&&!released.includes(p));
  const dear=(a,b)=>(lgP(D,b).basePrice||0)-(lgP(D,a).basePrice||0);
  const managers=D.managers.map(m=>{ const mm=makeManager(m.id,m.name); mm.squad=squadNow(D,m.id); mm.spent=Math.round((set.budget-(+m.purse_left))*100)/100; mm.connected=false; return mm; });
  S=newState(managers,set);
  S.players=JSON.parse(JSON.stringify(D.league.players));
  // Players already in squads count as sold so the pool and the squad rules see them.
  S.sold=D.ownership.filter(o=>!o.released&&o.to_round==null).map(o=>({playerId:o.player_id,managerId:o.manager_id,price:+o.price,round:0,pre:true}));
  S.window={code:LG.code,id:wid,order:[...released.sort(dear),...unsold.sort(dear)]};
  S.leagueCode=LG.code;
  // The commissioner bids from their own seat if they are signed in as a manager on this device.
  const mine=me(), seat=mine?managers.find(m=>m.id===mine.mid):null;
  NET.myName=seat?seat.name:"Commissioner"; NET.myId=seat?seat.id:0;
  if(seat)seat.connected=true;
  clearInterval(LG.timer); screen="home"; history.replaceState(null,"",location.pathname);
  hostRoom(genCode());
  sync();
}
async function saveWindowBuys(){
  if(UI.autoSaving||S.leagueSaved)return;
  const buys=S.sold.filter(x=>!x.pre).map(x=>({playerId:x.playerId,managerId:x.managerId,price:x.price}));
  UI.autoSaving=true; UI.saveMsg="Saving the window buys..."; render();
  try{ const n=await sbRpc("commish_record_buys",{p_code:S.window.code,p_pin:(commishFor(S.window.code)||{}).pin,p_buys:buys});
    S.leagueSaved=S.window.code; UI.saveMsg="Saved "+n+" buy"+(n===1?"":"s")+" to league "+S.window.code+"."; UI.saveBad=false; sync(); }
  catch(e){ UI.saveMsg="Buys not saved: "+e.message+" Try again from this screen."; UI.saveBad=true; }
  UI.autoSaving=false; render();
}

function windowSavePanel(state,canControl){
  if(!canControl) return `<section class="panel mt"><p class="muted">The commissioner saves these buys to league ${esc(state.window.code)}.</p></section>`;

/* Log */
function lgLog(D){
  const name=id=>esc((D.managers.find(x=>x.id===id)||{}).name||"");
  const pl=id=>esc(lgP(D,id).name);
  const list=ids=>(ids||[]).map(pl).join(", ")||"nothing";
  const say=e=>{ const d=e.data||{};
    switch(e.kind){
      case "auction-saved": return `Auction saved: ${d.sold} players across ${d.managers} squads.`;
      case "auction-resaved": return `Auction saved again: ${d.sold} players.`;
      case "vote-called": return `${name(e.manager_id)} called a vote to open the trade window.`;
      case "vote-failed": return `The vote failed, ${d.yes} of ${d.of} for.`;
      case "window-scheduled": return `Trade window booked for ${sydTime(d.opens)} to ${sydTime(d.closes)}.`;
      case "window-open": return `Trade window opened${d.by==="vote"?" by vote":""}.`;
      case "window-closed": return `Trade window closed. New players score from round ${d.effectiveRound}.`;
      case "release": return `${name(e.manager_id)} released ${pl(d.player)} (paid ${money(+d.paid)}, refund ${money(+d.refund)}).`;
      case "trade-offered": return `${name(e.manager_id)} offered ${list(d.give)}${+d.cash?" and "+money(+d.cash):""} to ${name(d.to)} for ${list(d.get)}.`;
      case "trade-accepted": return `Trade done: ${name(d.from)} sent ${list(d.give)}${+d.cash?" and "+money(+d.cash):""} to ${name(d.to)} for ${list(d.get)}.`;
      case "trade-rejected": return `${name(e.manager_id)} rejected an offer.`;
      case "trade-cancelled": return `${name(e.manager_id)} withdrew an offer.`;
      case "trade-vetoed": return `The commissioner vetoed a trade. Everything went back.`;
      case "buy": return `${name(e.manager_id)} bought ${pl(d.player)} for ${money(+d.price)} in the window auction.`;
      case "points-edited": return `The commissioner set ${pl(d.player)} to ${d.points==null?"the feed's points":d.points+" points"} for one match.`;
      case "pin-reset": return `The commissioner reset ${name(e.manager_id)}'s PIN.`;
      default: return esc(e.kind);
    }};
  const c=cpin();
  return `<section class="panel"><h2>Transactions</h2>
    <ul class="log mt-s">${D.log.map(e=>`<li><span class="small muted">${sydTime(e.at)}</span><span>${say(e)}</span></li>`).join("")||`<li class="muted">Nothing yet.</li>`}</ul></section>
    ${c?`<section class="panel mt stack"><h3>Reset a manager's PIN</h3><div class="row">
      <select id="resetmid" aria-label="Manager">${D.managers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select>
      <button class="btn" onclick="if(confirm('Reset this PIN? They set a new one next time they sign in.'))commishAct('commish_reset_pin',{p_mid:parseInt(document.getElementById('resetmid').value)})">Reset PIN</button></div></section>`:""}`;
}

    <h3>Where the numbers come from</h3>
    <p class="muted">Live scorecards from CricketData.org about every half hour during a match. Live bowling points leave out dot balls, so they can run a few points short. Exact points come from Cricsheet's ball-by-ball data once it's published, usually a day or two later. Ball-by-ball data from <a href="https://cricsheet.org" target="_blank" rel="noopener">Cricsheet</a>, used under the Open Data Commons Attribution License. If a feed fails, the commissioner can set any player's points by hand.</p>
  </section>`;
}

    for(let i=0;i<9000;i++){ g.fillStyle=r()<.5?"rgba(120,112,92,.10)":"rgba(255,255,255,.14)"; g.fillRect(r()*w,r()*h,1+r()*2,1+r()*2); }
    const scuffs=[["rgba(86,120,70,.16)",6],["rgba(140,96,70,.14)",7],["rgba(60,60,60,.08)",8]];
    scuffs.forEach(([col,n])=>{ for(let i=0;i<n;i++){ g.fillStyle=col; g.beginPath(); g.ellipse(r()*w,r()*h,20+r()*70,6+r()*18,r()*3.14,0,6.283); g.fill(); } });
    g.fillStyle="#1f4a37"; g.font="700 46px Arial, sans-serif"; g.textAlign="center";
    g.fillText("BIDBASH",w*0.25,h*0.30); g.font="700 20px Arial, sans-serif"; g.fillText("156 g  TURF",w*0.25,h*0.30+30);
    const b=document.createElement("canvas"); b.width=512; b.height=256; const bg=b.getContext("2d");
    bg.fillStyle="#808080"; bg.fillRect(0,0,512,256);
    for(let i=0;i<14000;i++){ const v=110+Math.floor(r()*60); bg.fillStyle="rgb("+v+","+v+","+v+")"; bg.fillRect(r()*512,r()*256,1.5,1.5); }
    const map=new T.CanvasTexture(c), bump=new T.CanvasTexture(b);
    if(renderer.capabilities.getMaxAnisotropy) map.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());
    return {map,bump};
  }
  function build(){
    const T=window.THREE;
    renderer=new T.WebGLRenderer({antialias:true,alpha:true,powerPreference:"low-power"});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    canvas=renderer.domElement;
    scene=new T.Scene();
    camera=new T.PerspectiveCamera(32,1,0.1,20); camera.position.set(0,0,4.6);
    scene.add(new T.HemisphereLight(0xfff6e0,0x1a1c1b,0.55));
    const key=new T.DirectionalLight(0xffffff,1.05); key.position.set(-2.4,3,3.2); scene.add(key);
    const rim=new T.DirectionalLight(0xf5d21f,0.9); rim.position.set(3,-0.6,-2.5); scene.add(rim);
    ball=new T.Group();
    const maps=leatherMaps();
    ball.add(new T.Mesh(new T.SphereGeometry(1,64,48),new T.MeshStandardMaterial({map:maps.map,bumpMap:maps.bump,bumpScale:0.012,roughness:0.62,metalness:0})));
    const seamMat=new T.MeshStandardMaterial({color:0xd8d1bd,roughness:0.8});
    [0,-0.045,0.045].forEach((y,i)=>{
      const rad=Math.sqrt(1-y*y);
      const ridge=new T.Mesh(new T.TorusGeometry(rad+0.004,i===0?0.02:0.012,10,128),seamMat);
      ridge.rotation.x=Math.PI/2; ridge.position.y=y; ball.add(ridge);
    });
    const rows=[-0.13,-0.095,-0.06,0.06,0.095,0.13], per=96;
    const stitches=new T.InstancedMesh(new T.CylinderGeometry(0.0065,0.0065,0.034,6),new T.MeshStandardMaterial({color:0xbdb59e,roughness:0.9}),rows.length*per);
    const d=new T.Object3D(); let n=0;
    rows.forEach((y,ri)=>{
      const rad=Math.sqrt(1-y*y);
      for(let k=0;k<per;k++){
        const a=(k+(ri%2)*0.5)/per*Math.PI*2;
        d.position.set(Math.cos(a)*rad*1.006,y,Math.sin(a)*rad*1.006);
        d.lookAt(0,0,0); d.rotateZ(y>0?0.55:-0.55); d.updateMatrix();
        stitches.setMatrixAt(n++,d.matrix);
      }
    });
    ball.add(stitches);
    ball.rotation.set(0.35,0.6,-1.05);
    scene.add(ball);
    canvas.addEventListener("pointerdown",()=>{ spin=4.5; start(); });
    if(window.IntersectionObserver) new IntersectionObserver(es=>{ visible=es[0].isIntersecting; if(visible)start(); }).observe(canvas);
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden)start(); });
    window.addEventListener("resize",size);
  }
  function size(){
    if(!canvas||!canvas.parentNode)return;
    const w=canvas.parentNode.clientWidth||300;
    renderer.setSize(w,w,false);
  }
  function frame(t){
    raf=0;
    if(!canvas.isConnected||document.hidden||!visible)return;
    const dt=Math.min(0.05,(t-last)/1000||0.016); last=t;
    spin+=(0.45-spin)*Math.min(1,dt*1.6);
    ball.rotateOnWorldAxis(AXIS,spin*dt);
    renderer.render(scene,camera);
    if(!REDUCED) raf=requestAnimationFrame(frame);
  }
  let AXIS=null;
  function start(){ if(!raf&&canvas&&canvas.isConnected){ last=performance.now(); raf=requestAnimationFrame(frame); } }
  function attach(){
    const stage=document.getElementById("ballstage");
    if(!stage||!canvas)return;
    stage.innerHTML=""; stage.appendChild(canvas); size(); start();
  }
  function mount(){
    if(failed)return;
    if(canvas)return attach();
    if(loading)return;
    loading=true;
    const go=()=>loadThree(0,ok=>{
      loading=false;
      if(!ok){ failed=true; return; }
      try{ build(); AXIS=new window.THREE.Vector3(0.25,1,0).normalize(); attach(); }
      catch(e){ failed=true; canvas=null; }
    });
    if(window.requestIdleCallback) requestIdleCallback(go,{timeout:1500}); else setTimeout(go,200);
  }
  return {mount};
})();

/* ================= THE GAVEL (plays on every screen when the host's sale event arrives) =================
   Spec, built in code: a turned wooden head (lathe profile, chamfered strike faces, two brass bands)
   on a turned handle (neck, swell, taper, grip, end knob). Pivot at the grip end; the head's axis is
   vertical at the strike so its end face lands on the SOLD stamp. Wood grain is a seeded canvas
   texture. Three.js loads lazily once the auction starts; until it is ready, or if WebGL fails,
   the SVG below swings instead. Reduced motion: no swing, the stamp and a resting gavel appear. */
const GAVEL_SVG = `<svg viewBox="0 0 240 240" aria-hidden="true"><g class="gv">
  <path d="M62 150 L186 70" stroke="#3a1e0f" stroke-width="15" stroke-linecap="round"/>
  <path d="M62 150 L186 70" stroke="#7a4424" stroke-width="10" stroke-linecap="round"/>
  <circle cx="188" cy="69" r="11" fill="#7a4424" stroke="#3a1e0f" stroke-width="3"/>
  <g transform="rotate(-33 58 154)">
    <rect x="22" y="128" width="72" height="52" rx="6" fill="#6b3a1f" stroke="#2e170b" stroke-width="3"/>
    <rect x="34" y="126" width="9" height="56" fill="#c9a43a"/><rect x="73" y="126" width="9" height="56" fill="#c9a43a"/>
  </g></g></svg>`;
const GAVEL = (function(){
  const SOURCES=["https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js","https://unpkg.com/three@0.128.0/build/three.min.js"];
  let renderer=null, scene=null, camera=null, pivot=null, shadow=null, ready=false, loading=false, failed=false, raf=0, timers=[];
  const RAISED=-0.72, STRIKE=0.16;
  function loadThree(i,done){
    if(window.THREE)return done(true);
    if(i>=SOURCES.length)return done(false);
    const s=document.createElement("script"); s.src=SOURCES[i]; s.async=true;
    s.onload=()=>done(!!window.THREE); s.onerror=()=>loadThree(i+1,done);
    document.head.appendChild(s);
  }
  function rng(seed){ let x=seed; return ()=>{ x=(x*1664525+1013904223)%4294967296; return x/4294967296; }; }
  function woodTexture(T){
    const r=rng(7), w=512, h=256, c=document.createElement("canvas"); c.width=w; c.height=h;
    const g=c.getContext("2d");
    g.fillStyle="#6b3a1f"; g.fillRect(0,0,w,h);
    for(let i=0;i<180;i++){ // long grain lines run along the turned axis (v)
      const x=r()*w, dark=r()<0.6;
      g.strokeStyle=dark?"rgba(40,18,6,"+(0.15+r()*0.25)+")":"rgba(160,96,52,"+(0.08+r()*0.15)+")";
      g.lineWidth=0.6+r()*2.4; g.beginPath(); g.moveTo(x,0);
      for(let y=0;y<=h;y+=16) g.lineTo(x+Math.sin(y*0.03+i)*3+r()*1.5,y);
      g.stroke();
    }
    const t=new T.CanvasTexture(c); t.wrapS=t.wrapT=T.RepeatWrapping; return t;
  }
  function build(){
    const T=window.THREE, stage=document.getElementById("gavelstage");
    renderer=new T.WebGLRenderer({antialias:true,alpha:true,powerPreference:"low-power"});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    scene=new T.Scene();
    camera=new T.PerspectiveCamera(30,1,0.1,40); camera.position.set(0.3,1.1,7.5); camera.lookAt(0.2,0.4,0);
    scene.add(new T.HemisphereLight(0xfff6e0,0x1a1c1b,0.7));
    const key=new T.DirectionalLight(0xffffff,1.1); key.position.set(-3,4,5); scene.add(key);
    const rim=new T.DirectionalLight(0xf5d21f,0.8); rim.position.set(4,1,-3); scene.add(rim);
    const wood=new T.MeshStandardMaterial({map:woodTexture(T),roughness:0.48,metalness:0.02});
    const brass=new T.MeshStandardMaterial({color:0xd4ad45,roughness:0.3,metalness:0.6,emissive:0x2a1f05});
    const V=(x,y)=>new T.Vector2(x,y);
    // Head, turned about its own axis (Y). Chamfered faces, two shallow grooves.
    const headProfile=[V(0,-0.64),V(0.25,-0.64),V(0.3,-0.6),V(0.31,-0.42),V(0.29,-0.4),V(0.31,-0.38),V(0.33,0),
                       V(0.31,0.38),V(0.29,0.4),V(0.31,0.42),V(0.3,0.6),V(0.25,0.64),V(0,0.64)];
    const head=new T.Mesh(new T.LatheGeometry(headProfile,48),wood);
    const gavel=new T.Group(); gavel.add(head);
    [-0.5,0.5].forEach(y=>{ const band=new T.Mesh(new T.CylinderGeometry(0.318,0.318,0.07,48),brass); band.position.y=y; gavel.add(band); });
    // Handle, turned, from the head (y=0) out to the knob (y=2.45), then laid along +X.
    const hp=[V(0,0),V(0.085,0),V(0.075,0.15),V(0.1,0.55),V(0.082,1.2),V(0.1,1.7),V(0.118,1.95),V(0.1,2.15),V(0.15,2.3),V(0.1,2.45),V(0,2.46)];
    const handle=new T.Mesh(new T.LatheGeometry(hp,32),wood);
    handle.rotation.z=-Math.PI/2; gavel.add(handle);
    const ferrule=new T.Mesh(new T.CylinderGeometry(0.11,0.11,0.08,32),brass);
    ferrule.rotation.z=-Math.PI/2; ferrule.position.x=0.36; gavel.add(ferrule);
    gavel.position.x=-2.4;                // grip end sits on the pivot
    pivot=new T.Group(); pivot.add(gavel);
    const yaw=new T.Group(); yaw.rotation.y=-0.42; yaw.position.set(1.15,0.55,0); yaw.add(pivot);
    scene.add(yaw);
    // Contact shadow under the strike point.
    const sc=document.createElement("canvas"); sc.width=sc.height=128; const sg=sc.getContext("2d");
    const grd=sg.createRadialGradient(64,64,0,64,64,64); grd.addColorStop(0,"rgba(0,0,0,.55)"); grd.addColorStop(1,"rgba(0,0,0,0)");
    sg.fillStyle=grd; sg.fillRect(0,0,128,128);
    shadow=new T.Mesh(new T.PlaneGeometry(1.4,0.5),new T.MeshBasicMaterial({map:new T.CanvasTexture(sc),transparent:true,depthWrite:false}));
    scene.add(shadow);
    pivot.rotation.z=STRIKE; scene.updateMatrixWorld(true);
    const face=new T.Vector3(0,-0.66,0); gavel.localToWorld(face); shadow.position.set(face.x,face.y,face.z-0.05);
    pivot.rotation.z=RAISED;
    ready=true;
  }
  function size(){
    const stage=document.getElementById("gavelstage"); if(!stage||!renderer)return;
    const w=stage.clientWidth||240; renderer.setSize(w,w,false);
  }
  function pose(a){
    pivot.rotation.z=a;
    const k=Math.max(0,Math.min(1,(a-RAISED)/(STRIKE-RAISED)));
    shadow.material.opacity=0.25+0.75*k; shadow.scale.set(0.6+0.4*k,1,1);
    renderer.render(scene,camera);
  }
  function preload(){
    if(ready||loading||failed||REDUCED)return;
    loading=true;
    const go=()=>loadThree(0,ok=>{ loading=false; if(!ok){failed=true;return;} try{ build(); }catch(e){ failed=true; ready=false; } });
    if(window.requestIdleCallback) requestIdleCallback(go,{timeout:2500}); else setTimeout(go,400);
  }
  function clear(){ timers.forEach(clearTimeout); timers=[]; if(raf){cancelAnimationFrame(raf);raf=0;} }
  function strike(line){
    const el=document.getElementById("stamp"), stage=document.getElementById("gavelstage");
    document.getElementById("stampline").textContent=line;
    document.getElementById("saleline").textContent="Sold: "+line;
    clear();
    el.classList.remove("on","hit","swing"); void el.offsetWidth;
    const use3d=ready&&!REDUCED&&!document.hidden;
    if(use3d){ stage.innerHTML=""; stage.appendChild(renderer.domElement); }
    else if(!stage.querySelector("svg")) stage.innerHTML=GAVEL_SVG;
    el.classList.add("on");
    const hit=()=>el.classList.add("hit");
    if(REDUCED||document.hidden){ hit(); }
    else if(use3d){
      size(); pose(RAISED);
      const t0=performance.now(), SW=300, RB=380;
      const step=t=>{
        const e=t-t0;
        if(e<SW){ const u=e/SW; pose(RAISED+(STRIKE-RAISED)*u*u*u); }
        else { if(!el.classList.contains("hit"))hit();
          const u=Math.min(1,(e-SW)/RB); pose(STRIKE-0.16*Math.sin(Math.PI*u)*(1-u*0.5)); if(u>=1){raf=0;return;} }
        raf=requestAnimationFrame(step);
      };
      raf=requestAnimationFrame(step);
    } else {
      el.classList.add("swing"); timers.push(setTimeout(hit,300));
    }
    timers.push(setTimeout(()=>el.classList.remove("on","hit","swing"),1800));
  }
  window.addEventListener("resize",size);
  return {preload,strike,_state:()=>({ready,failed,loading})};
})();

/* ================= BOOT ================= */
window.addEventListener("load",()=>{
  const lh=/^#league\/([A-Za-z0-9]{4,8})$/.exec(location.hash||"");
  if(lh){ openLeague(lh[1]); return; }
  if(location.hash && location.hash.length>3 && peerAvailable() && !st()){ goJoin(); }
});
render();
</script>
