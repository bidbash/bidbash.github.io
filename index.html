<style>
/* One system: scoreboard black, warm white, floodlight yellow. Flat fills, hard edges, no gradients.
   Spacing scale: 4 8 12 16 24 32 48 64. Type scale: 13 15 18 24 36 56 and the fluid scoreboard sizes. */
:root{
  --bg:#0c0e0d; --surface:#161918; --raised:#202422; --line:#373d39;
  --text:#f4f2ea; --muted:#a9aea8;
  --accent:#f5d21f; --accent-hi:#ffe45c; --accent-lo:#8f7a00; --accent-ink:#151300;
  --danger:#ff5a3c; --ok:#5fd38d;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r:4px;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);font-size:15px;line-height:1.45;background:var(--bg);color:var(--text);min-height:100vh}
#app{max-width:1240px;margin:0 auto;padding:var(--s4) var(--s4) var(--s8)}
h1,h2,h3,.display{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1}
h1{font-size:56px} h2{font-size:36px} h3{font-size:24px}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.label{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:var(--s4)}
.mt{margin-top:var(--s5)} .mt-s{margin-top:var(--s3)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Buttons: a physical key. It lifts on hover and goes down on press. */
.btn{
  font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase;
  min-height:48px;padding:0 var(--s5);border-radius:var(--r);cursor:pointer;
  background:var(--raised);color:var(--text);border:1px solid var(--line);
  box-shadow:0 3px 0 #000;transform:translateY(0);
  transition:transform .08s ease-out,box-shadow .08s ease-out,background-color .12s;
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);text-align:center;
}
.btn:hover:not(:disabled){background:#2a2f2c;transform:translateY(-1px);box-shadow:0 4px 0 #000}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 #000}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 3px 0 var(--accent-lo)}
.btn-primary:hover:not(:disabled){background:var(--accent-hi);box-shadow:0 4px 0 var(--accent-lo)}
.btn-primary:active:not(:disabled){box-shadow:0 0 0 var(--accent-lo)}
.btn-primary:focus-visible{outline-color:var(--text)}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-quiet{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
.btn-quiet:hover:not(:disabled){background:var(--raised);box-shadow:none;color:var(--text);transform:none}
.btn-quiet:active:not(:disabled){transform:translateY(1px)}
.btn-lg{min-height:60px;font-size:24px;padding:0 var(--s6)}
.btn-block{width:100%}
.btn-sm{min-height:44px;font-size:15px;padding:0 var(--s3)}

input,select{
  font-family:var(--body);font-size:16px;background:var(--bg);color:var(--text);
  border:1px solid var(--line);border-radius:var(--r);min-height:48px;padding:0 var(--s3);width:100%;
}
input:hover,select:hover{border-color:#59605b}
input[type=number]{width:96px}
input[type=checkbox]{width:24px;min-height:24px;height:24px;accent-color:var(--accent);padding:0}
.field{display:grid;gap:var(--s1)}
.field>span{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5)}
.panel-narrow{max-width:520px;margin:var(--s7) auto 0}
.notice{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s4);font-size:13px;color:var(--muted)}
.notice.bad{border-color:var(--danger);color:var(--text)}

/* Top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap;padding-bottom:var(--s4);margin-bottom:var(--s5);border-bottom:1px solid var(--line)}
.wordmark{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.04em;text-transform:uppercase}
.wordmark b{color:var(--accent);font-weight:800}
.codechip{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.14em;background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r);min-height:44px;padding:0 var(--s3);cursor:pointer;transition:transform .08s}
.codechip:hover{background:var(--accent-hi)} .codechip:active{transform:translateY(2px)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--ok)}
.dot.off{background:var(--danger)}

/* Home */
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s7);align-items:center;min-height:calc(100vh - 96px)}
.home h1{font-size:clamp(72px,13vw,176px);letter-spacing:-.01em;line-height:.86}
.home h1 b{color:var(--accent);font-weight:800}
.home .lede{font-size:24px;line-height:1.25;max-width:22ch;margin-top:var(--s4);font-weight:500}
.home .actions{display:grid;gap:var(--s3);max-width:380px;margin-top:var(--s6)}
.home .facts{margin-top:var(--s5);color:var(--muted);font-size:13px;max-width:44ch}
.ballstage{aspect-ratio:1;width:100%;max-width:560px;justify-self:center;position:relative}
.ballstage canvas,.ballstage svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Room code as scoreboard cells */
.codecells{display:flex;gap:var(--s2);justify-content:center;cursor:pointer;background:none;border:0;width:100%}
.codecells span{font-family:var(--display);font-weight:800;font-size:clamp(48px,11vw,96px);line-height:1;background:var(--bg);color:var(--accent);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s4);min-width:1.1em;text-align:center;transition:transform .08s}
.codecells:active span{transform:translateY(3px)}

/* The lot: who is under the hammer. Built to be read from the couch. */
.lot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lot-band{background:var(--club);color:var(--club-ink);display:flex;gap:var(--s2) var(--s5);align-items:center;flex-wrap:wrap;padding:var(--s3) var(--s5);font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase}
.lot-band .grow{flex:1}
.lot-body{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:var(--s6);padding:var(--s6) var(--s5);align-items:end}
.lot-name{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(48px,8.4vw,128px);line-height:.88;letter-spacing:-.01em;overflow-wrap:anywhere}
.lot-note{margin-top:var(--s3);color:var(--muted);max-width:46ch}
.lot-note b{color:var(--text)}
.score{text-align:right}
.score .amt{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(88px,15vw,208px);line-height:.82;color:var(--accent)}
.score .leader{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.4vw,44px);text-transform:uppercase;letter-spacing:.02em;margin-top:var(--s2);overflow-wrap:anywhere}
.score .leader.none{color:var(--muted)}
.clock{display:flex;align-items:center;gap:var(--s4);padding:0 var(--s5) var(--s5)}
.clock .secs{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;font-size:56px;line-height:1;min-width:2.4ch}
.clock .track{flex:1;height:16px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.clock .bar{height:100%;background:var(--accent);transition:width .25s linear}
.lot[data-urgent] .clock .secs{color:var(--danger)}
.lot[data-urgent] .clock .bar{background:var(--danger)}
.lot-actions{border-top:1px solid var(--line);padding:var(--s5);display:grid;gap:var(--s4)}
.bidgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s3)}
.bid{min-height:88px;flex-direction:column;gap:0;font-size:36px;line-height:1}
.bid small{font-family:var(--body);font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;opacity:.85;margin-top:var(--s1)}
.bid .who{font-size:18px;letter-spacing:.06em}
.bid-solo{min-height:104px;font-size:56px;width:100%;max-width:560px;margin:0 auto}
.bid.leading{background:var(--surface);color:var(--accent);border-color:var(--accent);box-shadow:none;opacity:1}
.hostbar{display:flex;gap:var(--s3);flex-wrap:wrap;justify-content:center}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.score .amt.bump{animation:bump .22s ease-out}

/* Manager board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--s3)}
.mgr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4)}
.mgr.lead{outline:2px solid var(--accent);outline-offset:-2px}
.mgr-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2)}
.mgr-name{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;overflow-wrap:anywhere}
.mgr-left{font-family:var(--display);font-weight:800;font-size:36px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.mgr-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-top:var(--s3);font-size:13px;color:var(--muted)}
.mgr-stats b{display:block;color:var(--text);font-family:var(--display);font-size:18px;font-weight:700}
.tagline{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.you{background:var(--text);color:var(--bg);padding:0 var(--s1);border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:var(--s3)}
.chip{font-size:13px;background:var(--raised);border-radius:2px;padding:2px var(--s2) 2px 2px;display:inline-flex;align-items:center;gap:var(--s2)}
.sw{width:16px;height:16px;border-radius:2px;background:var(--club,#777);display:inline-block;flex:none}
.pill{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:2px;padding:0 var(--s1)}
.pill.warn{color:var(--danger)}

table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.price{font-family:var(--display);font-weight:700;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s4)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:flex-start;justify-content:center;padding:var(--s5) var(--s3);z-index:50;overflow:auto}
.modal .panel{max-width:960px;width:100%}
.filters{display:grid;grid-template-columns:2fr 1.4fr 1fr auto 1fr;gap:var(--s3);align-items:center}
.addrow{display:grid;grid-template-columns:2fr 1.4fr 1fr auto 96px auto;gap:var(--s3);align-items:center}
.check{display:inline-flex;align-items:center;gap:var(--s2);font-size:13px;color:var(--muted);white-space:nowrap}

#toasts{position:fixed;top:var(--s4);left:50%;transform:translateX(-50%);z-index:99;display:grid;gap:var(--s2);justify-items:center;width:min(92vw,560px);pointer-events:none}
.toast{background:var(--text);color:var(--bg);font-weight:600;padding:var(--s3) var(--s4);border-radius:var(--r);text-align:center;animation:drop .16s ease-out}
@keyframes drop{from{transform:translateY(-8px)}to{transform:none}}
#stamp{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);pointer-events:none;padding:var(--s4)}
#stamp.on{display:flex}
#stamp .ink{border:8px solid var(--danger);color:var(--danger);border-radius:var(--r);padding:var(--s4) var(--s6);text-align:center;transform:rotate(-6deg);background:var(--bg);animation:thump .28s cubic-bezier(.2,1.4,.4,1)}
#stamp .word{font-family:var(--display);font-weight:800;font-size:clamp(96px,22vw,260px);line-height:.85;letter-spacing:.02em}
#stamp .line{font-family:var(--display);font-weight:700;font-size:clamp(18px,3.2vw,36px);text-transform:uppercase;color:var(--text);margin-top:var(--s2)}
@keyframes thump{from{transform:rotate(-6deg) scale(1.8)}to{transform:rotate(-6deg) scale(1)}}

@media (max-width:820px){
  h1{font-size:36px} h2{font-size:24px}
  .home{grid-template-columns:1fr;gap:var(--s4);min-height:0;padding-top:var(--s4)}
  .ballstage{max-width:240px;order:-1;justify-self:start}
  .home .actions{max-width:none}
  .lot-band{font-size:18px;padding:var(--s3) var(--s4);gap:var(--s3)}
  .lot-body{grid-template-columns:1fr;gap:var(--s4);padding:var(--s5) var(--s4)}
  .score{text-align:left}
  .clock{padding:0 var(--s4) var(--s4)} .clock .secs{font-size:36px}
  .lot-actions{padding:var(--s4)}
  .bidgrid{grid-template-columns:1fr 1fr}
  .bid{min-height:72px;font-size:24px}
  .bid-solo{min-height:88px;font-size:36px}
  .filters,.addrow{grid-template-columns:1fr 1fr}
  .panel{padding:var(--s4)}
  .hostbar .btn{flex:1 1 44%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

/* ================= APP STATE ================= */
let S = null;            // authoritative game state (host / local)
let CS = null;           // client copy of game state (join mode)
let screen = "home";     // pre-game UI screen
let NET = { mode:null, peer:null, conns:[], code:null, myId:0, myName:"", status:"", spectator:false };
let UI = { pool:false, poolQ:"", poolTeam:"", poolRole:"", poolOS:false, poolSort:"price", editPlayers:false, lastError:"" };
const LS_STATE="bbl15_state_v1", LS_CLIENT="bbl15_client_v1", LS_NET="bbl15_net_v1";

const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => String(Math.round(n*100)/100);
const money = n => "$" + fmt(n);
const st = () => NET.mode==="client" ? CS : S;
const byId = (state,pid) => state.players.find(p=>p.id===pid);

function defaultSettings(){
  return {budget:100, squadSize:13, maxOverseas:4, minBAT:4, minBOWL:4, minAR:2, minWK:1,
          increment:0.5, order:"random", marqueeFirst:true, timerOn:true, timerSecs:15};
}
function newState(managers, settings){
  return {
    phase:"lobby", settings,
    players: JSON.parse(JSON.stringify(PLAYERS)),
    managers, queue:[], qIndex:0, current:null,
    sold:[], unsold:[], round:1
  };
}
function makeManager(id,name){ return {id, name, squad:[], spent:0, connected:true, cid:null}; }

/* ================= HELPERS: rules & validation ================= */
const remBudget = m => st().settings.budget - m.spent;
function roleCounts(state,m){
  const c={BAT:0,BOWL:0,AR:0,WK:0};
  m.squad.forEach(pid=>{const p=byId(state,pid); if(p)c[p.role]++});
  return c;
}
const osCount=(state,m)=>m.squad.filter(pid=>{const p=byId(state,pid);return p&&p.overseas}).length;
function minPoolPrice(state){
  let min=Infinity;
  for(const p of state.players){
    if(!state.sold.some(s=>s.playerId===p.id)) min=Math.min(min,p.basePrice);
  }
  return isFinite(min)?min:4;
}
// Returns null if manager may bid `price` for `player`, else a reason string.
function bidBlockReason(state,m,player,price){
  const set=state.settings;
  if(m.squad.length>=set.squadSize) return "Squad full";
  if(price>state.settings.budget-m.spent) return "Not enough budget";
  if(player.overseas && osCount(state,m)>=set.maxOverseas) return "Overseas quota full";
  const slotsAfter=set.squadSize-m.squad.length-1;
  const reserve=slotsAfter*minPoolPrice(state);
  if(price>(set.budget-m.spent)-reserve) return "Must keep "+money(reserve)+" for remaining slots";
  const c=roleCounts(state,m); c[player.role]++;
  const needed=Math.max(0,set.minBAT-c.BAT)+Math.max(0,set.minBOWL-c.BOWL)+Math.max(0,set.minAR-c.AR)+Math.max(0,set.minWK-c.WK);
  if(needed>slotsAfter) return "Would make role minimums impossible";
  return null;
}
function nextBid(state){
  const cur=state.current;
  const p=byId(state,cur.playerId);
  return cur.bidderId==null ? p.basePrice : Math.round((cur.bid+state.settings.increment)*100)/100;
}

/* ================= NETWORKING (MQTT over public brokers) ================= */
const peerAvailable = () => !window.MQTT_FAILED && typeof mqtt!=="undefined";
const BROKERS = ["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt","wss://test.mosquitto.org:8081"];
const topicRoot = code => "bbl15auction/"+code.toUpperCase();
const myCid = "c"+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
function genCode(){
  const chars="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let c="";
  for(let i=0;i<5;i++)c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}
// Connect to the first reachable broker, then call onReady(client).
function netConnect(brokerIdx,will,onReady){
  if(brokerIdx>=BROKERS.length){ NET.status="Couldn't reach any relay server: check your internet."; render(); return; }
  NET.status=brokerIdx===0?"Connecting…":"Trying backup server…"; render();
  const client=mqtt.connect(BROKERS[brokerIdx],{
    clientId:"bbl15_"+myCid, clean:true, connectTimeout:7000, reconnectPeriod:2000,
    will:will||undefined
  });
  let opened=false;
  client.on("connect",()=>{
    if(!opened){ opened=true; NET.client=client; onReady(client); }
    else { NET.status="live"; render(); } // reconnect after drop
  });
  client.on("offline",()=>{ if(opened){ NET.status="Reconnecting…"; render(); } });
  client.on("error",()=>{ if(!opened){ client.end(true); netConnect(brokerIdx+1,will,onReady); } });
  setTimeout(()=>{ if(!opened){ try{client.end(true);}catch(e){} netConnect(brokerIdx+1,will,onReady); } },8000);
}
const pub=(topic,obj,retain)=>{ try{ NET.client&&NET.client.publish(topic,JSON.stringify(obj),{retain:!!retain}); }catch(e){} };
function packState(){ return JSON.parse(JSON.stringify(S)); }

function hostRoom(code){
  NET.mode="host"; NET.code=code.toUpperCase();
  const T=topicRoot(NET.code);
  netConnect(0,null,client=>{
    NET.status="live";
    localStorage.setItem(LS_NET,JSON.stringify({mode:"host",code:NET.code,name:NET.myName}));
    client.subscribe(T+"/h");
    client.on("message",(topic,buf)=>{
      if(topic!==T+"/h")return;
      let msg; try{ msg=JSON.parse(buf.toString()); }catch(e){ return; }
      hostOnMessage(msg);
    });
    sync();
  });
}
function hostOnMessage(msg){
  if(!msg||typeof msg!=="object"||!msg.cid)return;
  if(msg.t==="join"){
    const name=String(msg.name||"").trim().slice(0,20)||"Player";
    let m=S.managers.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(m&&m.cid===msg.cid&&m.connected){ pub(topicRoot(NET.code)+"/c/"+msg.cid,{t:"you",id:m.id}); return; }
    if(!m){
      if(S.phase!=="lobby"){ pub(topicRoot(NET.code)+"/c/"+msg.cid,{t:"spectator"}); return; }
      if(S.managers.length>=10){ pub(topicRoot(NET.code)+"/c/"+msg.cid,{t:"err",msg:"Room is full (10 managers max)"}); return; }
      m=makeManager(Math.max(0,...S.managers.map(x=>x.id))+1,name);
      S.managers.push(m);
      toast(name+" joined the room");
    } else {
      toast(name+" reconnected");
    }
    m.connected=true; m.cid=msg.cid;
    pub(topicRoot(NET.code)+"/c/"+msg.cid,{t:"you",id:m.id});
    sync();
    return;
  }
  if(msg.t==="leave"){
    const m=S.managers.find(x=>x.cid===msg.cid);
    if(m&&m.connected){ m.connected=false; toast(m.name+" disconnected"); sync(); }
    return;
  }
  if(msg.t==="bid"){
    const m=S.managers.find(x=>x.cid===msg.cid);
    if(m)placeBid(m.id);
    return;
  }
}
function sendToManager(m,obj){ if(m&&m.cid)pub(topicRoot(NET.code)+"/c/"+m.cid,obj); }
function sync(){
  if(NET.mode==="host"||NET.mode==="local"){
    try{ localStorage.setItem(LS_STATE,JSON.stringify({net:{mode:NET.mode,code:NET.code,myName:NET.myName},state:packState()})); }catch(e){}
  }
  if(NET.mode==="host") pub(topicRoot(NET.code)+"/s",{t:"state",state:packState()},true);
  render();
}
let roomWait=null;
function joinRoom(code,name){
  NET.mode="client"; NET.code=code.toUpperCase(); NET.myName=name;
  const T=topicRoot(NET.code);
  netConnect(0,{topic:T+"/h",payload:JSON.stringify({t:"leave",cid:myCid}),qos:0,retain:false},client=>{
    NET.status="live";
    client.subscribe([T+"/s",T+"/c/"+myCid,T+"/toast"]);
    client.on("message",(topic,buf)=>{
      let msg; try{ msg=JSON.parse(buf.toString()); }catch(e){ return; }
      if(topic===T+"/s"&&msg.t==="state"){
        const hadState=!!CS; CS=msg.state;
        if(!hadState){ clearTimeout(roomWait); pub(T+"/h",{t:"join",name:NET.myName,cid:myCid});
          localStorage.setItem(LS_CLIENT,JSON.stringify({code:NET.code,name:NET.myName})); }
        render(); return;
      }
      if(topic===T+"/c/"+myCid){
        if(msg.t==="you"){ NET.myId=msg.id; NET.spectator=false; }
        if(msg.t==="spectator"){ NET.spectator=true; toast("Auction already started: you're spectating"); }
        if(msg.t==="err"){ NET.status=msg.msg; }
        if(msg.t==="toast"){ toast(msg.msg); }
        render(); return;
      }
      if(topic===T+"/toast"){ toast(msg.msg); }
    });
    clearTimeout(roomWait);
    roomWait=setTimeout(()=>{ if(!CS){ NET.status="Room not found: double-check the code with your host."; render(); } },7000);
  });
}
function hostToast(msg){ // toast locally + push to clients
  toast(msg);
  if(NET.mode==="host") pub(topicRoot(NET.code)+"/toast",{t:"toast",msg});
}

/* ================= GAME ACTIONS (host/local only) ================= */
function buildQueue(){
  const set=S.settings;
  let pool=S.players.map(p=>p.id);
  const price=(pid)=>byId(S,pid).basePrice;
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const order=a=> set.order==="price" ? a.sort((x,y)=>price(y)-price(x)) : shuffle(a);
  if(set.marqueeFirst){
    const mq=order(pool.filter(pid=>price(pid)>=14));
    const rest=order(pool.filter(pid=>price(pid)<14));
    pool=[...mq,...rest];
  } else pool=order(pool);
  S.queue=pool; S.qIndex=0;
}
function startAuction(){
  if(S.managers.length<2){ UI.lastError="Need at least 2 managers."; render(); return; }
  // sanity: budget must cover squad at min prices
  const minTotal=S.settings.squadSize*Math.min(...S.players.map(p=>p.basePrice));
  if(S.settings.budget<minTotal){ UI.lastError="Budget too small: "+S.settings.squadSize+" slots need at least "+money(minTotal)+"."; render(); return; }
  UI.lastError="";
  buildQueue(); S.phase="auction"; startCurrent();
  hostToast("Auction started! "+S.queue.length+" players in the queue.");
  sync();
}
function startCurrent(){
  // find next player still needed & at least one manager with space
  while(S.qIndex<S.queue.length){
    const pid=S.queue[S.qIndex];
    if(!S.sold.some(x=>x.playerId===pid) && byId(S,pid)){ break; }
    S.qIndex++;
  }
  if(S.qIndex>=S.queue.length){ S.current=null; return; }
  const p=byId(S,S.queue[S.qIndex]);
  S.current={playerId:p.id, bid:p.basePrice, bidderId:null,
             deadline:S.settings.timerOn?Date.now()+S.settings.timerSecs*1000:null};
}
function everyoneFull(){ return S.managers.every(m=>m.squad.length>=S.settings.squadSize); }
function placeBid(mid){
  if(!S||S.phase!=="auction"||!S.current)return;
  const m=S.managers.find(x=>x.id===mid); if(!m)return;
  if(S.current.bidderId===mid)return; // already highest
  const p=byId(S,S.current.playerId);
  const price=nextBid(S);
  const block=bidBlockReason(S,m,p,price);
  if(block){ if(NET.mode==="host"&&m.id!==NET.myId)sendToManager(m,{t:"toast",msg:"Bid blocked: "+block}); else toast("Bid blocked: "+block); return; }
  S.current.bid=price; S.current.bidderId=mid;
  if(S.settings.timerOn) S.current.deadline=Date.now()+S.settings.timerSecs*1000;
  sync();
}
function sellCurrent(){
  const cur=S.current; if(!cur)return;
  if(cur.bidderId==null){ passCurrent(); return; }
  const m=S.managers.find(x=>x.id===cur.bidderId);
  const p=byId(S,cur.playerId);
  m.squad.push(p.id); m.spent=Math.round((m.spent+cur.bid)*100)/100;
  S.sold.push({playerId:p.id, managerId:m.id, price:cur.bid, round:S.round});
  S.unsold=S.unsold.filter(x=>x!==p.id);
  hostToast("SOLD! "+p.name+" → "+m.name+" for "+money(cur.bid));
  S.qIndex++;
  if(everyoneFull()){ finishAuction(); return; }
  startCurrent(); sync();
}
function passCurrent(){
  const cur=S.current; if(!cur)return;
  const p=byId(S,cur.playerId);
  if(!S.unsold.includes(p.id))S.unsold.push(p.id);
  hostToast(p.name+" goes UNSOLD");
  S.qIndex++; startCurrent(); sync();
}
function undoLast(){
  const last=S.sold.pop(); if(!last)return;
  const m=S.managers.find(x=>x.id===last.managerId);
  m.squad=m.squad.filter(x=>x!==last.playerId);
  m.spent=Math.round((m.spent-last.price)*100)/100;
  if(S.phase==="results")S.phase="auction";
  S.queue.splice(S.qIndex,0,last.playerId);
  hostToast("Undo: "+byId(S,last.playerId).name+" returned to auction");
  startCurrent(); sync();
}
function reauctionUnsold(){
  if(!S.unsold.length)return;
  S.queue=[...S.unsold]; S.unsold=[]; S.qIndex=0; S.round++;
  hostToast("Re-auction round "+S.round+": "+S.queue.length+" players back in!");
  startCurrent(); sync();
}
function finishAuction(){
  if(S.current&&!S.sold.some(x=>x.playerId===S.current.playerId)&&!S.unsold.includes(S.current.playerId))
    S.unsold.push(S.current.playerId);
  // everything still queued and never auctioned also counts as unsold
  for(let i=S.qIndex;i<S.queue.length;i++){
    const pid=S.queue[i];
    if(!S.sold.some(x=>x.playerId===pid)&&!S.unsold.includes(pid))S.unsold.push(pid);
  }
  S.phase="results"; S.current=null; hostToast("Auction complete!"); sync();
}
function restartAll(){
  if(!confirm("Restart and wipe this auction?"))return;
  if(NET.mode==="host"&&NET.client){ try{ NET.client.publish(topicRoot(NET.code)+"/s","",{retain:true}); }catch(e){} }
  localStorage.removeItem(LS_STATE); localStorage.removeItem(LS_NET);
  setTimeout(()=>location.reload(),150);
}

/* timer loop (host/local resolves; everyone re-renders countdown) */
setInterval(()=>{
  const state=st();
  if(!state||state.phase!=="auction"||!state.current)return;
  if((NET.mode==="host"||NET.mode==="local") && state.current.deadline && Date.now()>state.current.deadline){
    state.current.bidderId!=null ? sellCurrent() : passCurrent();
    return;
  }
  if(state.current.deadline){
    const el=document.getElementById("timerbar"), tl=document.getElementById("timerleft");
    if(el){
      const total=state.settings.timerSecs*1000;
      const left=Math.max(0,state.current.deadline-Date.now());
      el.style.width=(left/total*100)+"%";
      if(tl)tl.textContent=Math.ceil(left/1000)+"s";
    }
  }
},250);

/* ================= EXPORT ================= */
function download(name,text,type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
}
function exportCSV(){
  const state=st();
  let rows=[["Manager","Player","BBL Team","Role","Overseas","Price"]];
  state.managers.forEach(m=>{
    m.squad.forEach(pid=>{const p=byId(state,pid);
      const s=state.sold.find(x=>x.playerId===pid);
      rows.push([m.name,p.name,p.team,p.role,p.overseas?"Yes":"No",fmt(s?s.price:0)]);});
  });
  state.unsold.forEach(pid=>{const p=byId(state,pid);rows.push(["UNSOLD",p.name,p.team,p.role,p.overseas?"Yes":"No",""]);});
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
  download("bbl15-auction-results.csv",csv,"text/csv");
}
function exportJSON(){
  const state=st();
  const out={settings:state.settings,
    managers:state.managers.map(m=>({name:m.name,spent:m.spent,remaining:state.settings.budget-m.spent,
      squad:m.squad.map(pid=>{const p=byId(state,pid);const s=state.sold.find(x=>x.playerId===pid);
        return {...p,price:s?s.price:0};})})),
    unsold:state.unsold.map(pid=>byId(state,pid))};
  download("bbl15-auction-results.json",JSON.stringify(out,null,2),"application/json");
}

/* ================= TOASTS AND THE SOLD STAMP ================= */
const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let stampTimer=null;
function toast(msg){
  const sold=/^SOLD! (.+) → (.+) for (.+)$/.exec(msg);
  if(sold){
    const el=document.getElementById("stamp");
    document.getElementById("stampline").textContent=sold[1]+" to "+sold[2]+" for "+sold[3];
    el.classList.remove("on"); void el.offsetWidth; el.classList.add("on");
    clearTimeout(stampTimer); stampTimer=setTimeout(()=>el.classList.remove("on"),1500);
    return;
  }
  const box=document.getElementById("toasts");
  const el=document.createElement("div"); el.className="toast"; el.textContent=msg;
  box.appendChild(el);
  setTimeout(()=>el.remove(),3200);
}

/* ================= RENDER ================= */
const clubStyle = team => { const t=TEAMS[team]||{c:"#777",ink:"#fff"}; return "--club:"+t.c+";--club-ink:"+t.ink; };
const swatch = team => `<i class="sw" style="${clubStyle(team)}"></i>`;
let lastBidShown=null;

function render(){
  const app=document.getElementById("app");
  const state=st();
  let html="";
  if(NET.mode==="client"){
    html = !CS ? viewClientConnecting() :
      CS.phase==="lobby" ? viewLobby(CS,false) :
      CS.phase==="auction" ? viewAuction(CS,false) : viewResults(CS,false);
  } else if(S){
    html = S.phase==="lobby" ? viewLobby(S,true) :
      S.phase==="auction" ? viewAuction(S,true) : viewResults(S,true);
  } else {
    html = screen==="join"?viewJoin() : screen==="setup"?viewSetup() : viewHome();
  }
  if(UI.pool && state) html+=viewPool(state);
  app.innerHTML=html;
  if(!state && screen==="home") BALL.mount();
  if(!state && screen==="setup" && setupMode==="local") render_localnames(document.getElementById("nmgrs").value);
  tickUrgency();
}

function header(state,extra){
  const code=NET.code?`<button class="codechip" onclick="copyLink()" title="Copy the invite link">ROOM ${esc(NET.code)}</button>`:"";
  const net=NET.mode&&NET.mode!=="local"?(NET.status==="live"?`<span class="dot" title="Connected"></span>`:`<span class="dot off"></span><span class="small muted">${esc(NET.status)}</span>`):"";
  return `<header class="topbar">
    <div class="row"><span class="wordmark">Bid<b>Bash</b></span>${code}${net}</div>
    <div class="row">${extra||""}</div>
  </header>`;
}
function copyLink(){
  const link=location.origin.startsWith("http")?location.href.split("#")[0]+"#"+NET.code:NET.code;
  if(navigator.clipboard) navigator.clipboard.writeText(link).then(()=>toast("Invite copied: "+link)).catch(()=>toast("Room code: "+NET.code));
  else toast("Room code: "+NET.code);
}

let setupMode="local";

function render_localnames(n){
  n=Math.max(2,Math.min(10,parseInt(n)||4));
  const box=document.getElementById("localnames"); if(!box)return;
  let html="";
  for(let i=0;i<n;i++){
    const prev=document.getElementById("mn"+i);
    html+=`<input id="mn${i}" maxlength="20" aria-label="Manager ${i+1} name" placeholder="Manager ${i+1}" value="${prev?esc(prev.value):""}">`;
  }
  box.innerHTML=html;
}
function createGame(){
  UI.lastError="";
  if(setupMode==="host"){
    const name=(document.getElementById("hostname").value||"").trim();
    if(!name){ UI.lastError="Add your name first."; render(); return; }
    NET.myName=name; NET.myId=1;
    S=newState([makeManager(1,name)],defaultSettings());
    hostRoom(genCode());
    sync();
  } else {
    NET.mode="local";
    const n=Math.max(2,Math.min(10,parseInt(document.getElementById("nmgrs").value)||4));
    const managers=[];
    for(let i=0;i<n;i++){
      const el=document.getElementById("mn"+i);
      const v=((el&&el.value)||"").trim()||("Manager "+(i+1));
      managers.push(makeManager(i+1,v));
    }
    S=newState(managers,defaultSettings());
    sync();
  }
}
function resumeSaved(){
  try{
    const saved=JSON.parse(localStorage.getItem(LS_STATE));
    S=saved.state; S.managers.forEach(m=>{m.connected=false;});
    NET.myName=saved.net.myName||""; NET.myId=1;
    if(saved.net.mode==="host"&&peerAvailable()){ hostRoom(saved.net.code||genCode()); }
    else NET.mode="local";
    if(NET.mode==="host")S.managers.forEach(m=>{if(m.name===NET.myName)m.connected=true;});
    sync(); toast("Auction restored");
  }catch(e){ toast("That save would not load"); localStorage.removeItem(LS_STATE); }
}

function numSet(key,label,val,min,max,step){
  return `<label class="field"><span>${label}</span>

}
function setRule(k,v){ S.settings[k]=v; sync(); }
function addLocalManager(){
  if(S.managers.length>=10)return;
  const name=prompt("Manager name?","Manager "+(S.managers.length+1));
  if(name===null)return;
  S.managers.push(makeManager(Math.max(0,...S.managers.map(x=>x.id))+1,name.trim()||("Manager "+(S.managers.length+1))));
  sync();
}
function removeManager(id){ S.managers=S.managers.filter(m=>m.id!==id); sync(); }

/* ---------- auction ---------- */
function viewAuction(state,canControl){
  const set=state.settings;
  if(!state.current) return viewRoundEnd(state,canControl);
  const p=byId(state,state.current.playerId);
  const cur=state.current;
  const leader=cur.bidderId!=null?state.managers.find(m=>m.id===cur.bidderId):null;
  const next=nextBid(state);
  const left=state.queue.length-state.qIndex-1;
  const isMarquee=p.basePrice>=14&&set.marqueeFirst&&state.round===1;
  const bidKey=cur.playerId+":"+cur.bid+":"+cur.bidderId;
  const bump=lastBidShown!==null&&lastBidShown!==bidKey&&cur.bidderId!=null;
  lastBidShown=bidKey;

  let bidControls="";
  if(NET.mode==="local"){
    bidControls=`<div class="bidgrid">`+state.managers.map(m=>{
      const leading=cur.bidderId===m.id;
      const block=leading?null:bidBlockReason(state,m,p,next);
      return `<button class="btn ${leading?"":"btn-primary"} bid ${leading?"leading":""}" ${leading||block?"disabled":""} onclick="placeBid(${m.id})">
        <span class="who">${esc(m.name)}</span>
        <span>${leading?"Leading":"Bid "+money(next)}</span>
        <small>${block?esc(block):money(set.budget-m.spent)+" left, "+m.squad.length+" of "+set.squadSize}</small>
      </button>`;}).join("")+`</div>`;
  } else {
    const me=state.managers.find(m=>m.id===NET.myId);
    if(NET.spectator||!me){
      bidControls=`<p class="muted" style="text-align:center">You are watching from the hill. No paddle this time.</p>`;
    } else {
      const leading=cur.bidderId===me.id;
      const block=leading?null:bidBlockReason(state,me,p,next);
      bidControls=`<button class="btn ${leading?"":"btn-primary"} bid bid-solo ${leading?"leading":""}" ${leading||block?"disabled":""}
          onclick="${NET.mode==="host"?`placeBid(${me.id})`:"clientBid()"}">
          <span>${leading?"You lead":"Bid "+money(next)}</span>
          <small>${block?esc(block):money(set.budget-me.spent)+" left in your purse"}</small>
        </button>`;
    }
  }
  const hostControls=canControl?`
    <div class="hostbar">
      <button class="btn btn-primary" onclick="sellCurrent()">${cur.bidderId!=null?"Hammer down":"No bids, pass"}</button>
      <button class="btn" onclick="passCurrent()">Pass unsold</button>
      <button class="btn" ${state.sold.length?"":"disabled"} onclick="undoLast()">Undo last sale</button>
      <button class="btn btn-danger" onclick="finishAuction()">End the auction</button>
    </div>`:"";

  return `${header(state,`
      <span class="label">${left} to come, round ${state.round}</span>
      <button class="btn btn-sm" onclick="UI.pool=true;render()">Player pool</button>`)}
  <main>
  <section class="lot" id="lot" style="${clubStyle(p.team)}" aria-live="polite">
    <div class="lot-band">
      <span>${esc(p.team)}</span>
      <span>${ROLE_LABEL[p.role]||p.role}</span>
      ${p.overseas?`<span>Overseas</span>`:""}
      ${isMarquee?`<span>Marquee</span>`:""}
      <span class="grow"></span><span>Base ${money(p.basePrice)}</span>
    </div>
    <div class="lot-body">
      <div>
        <div class="lot-name">${esc(p.name)}</div>
        ${p.note||p.unverified?`<p class="lot-note">${p.unverified?`<b>Unverified.</b> `:""}${esc(p.note||"Check this one before you bid big.")}</p>`:""}
      </div>
      <div class="score">
        <div class="label">${leader?"Current bid":"Opens at"}</div>
        <div class="amt ${bump?"bump":""}">${money(cur.bid)}</div>
        <div class="leader ${leader?"":"none"}">${leader?esc(leader.name):"No bids yet"}</div>
      </div>
    </div>
    ${cur.deadline?`<div class="clock"><span class="secs" id="timerleft"></span><div class="track"><div class="bar" id="timerbar" style="width:100%"></div></div></div>`:""}
    <div class="lot-actions">${bidControls}${hostControls}</div>
  </section>
  <h3 class="mt">The table</h3>
  <div class="board mt-s">${state.managers.map(m=>mgrCard(state,m,cur.bidderId===m.id)).join("")}</div>
  </main>`;
}
function clientBid(){ pub(topicRoot(NET.code)+"/h",{t:"bid",cid:myCid}); }
function mgrCard(state,m,winning){
  const set=state.settings;
  const c=roleCounts(state,m);
  const online=NET.mode!=="local";
  const chips=m.squad.map(pid=>{const p=byId(state,pid);
    return `<span class="chip">${swatch(p.team)}${esc(p.name)}</span>`;}).join("");
  return `<div class="mgr ${winning?"lead":""}">
    <div class="mgr-head">
      <span class="mgr-name">${esc(m.name)} ${online&&m.id===NET.myId?`<span class="tagline you">You</span>`:""}</span>
      <span class="mgr-left" title="Purse left">${money(set.budget-m.spent)}</span>
    </div>
    <div class="tagline muted">${winning?"Leading this lot":online&&!m.connected?"Away from the table":"Purse left"}</div>
    <div class="mgr-stats">
      <span><b>${m.squad.length}/${set.squadSize}</b>Squad</span>
      <span><b>${osCount(state,m)}/${set.maxOverseas}</b>Overseas</span>
      <span><b>${money(m.spent)}</b>Spent</span>
      <span><b>${c.BAT}/${set.minBAT}</b>Bat</span>
      <span><b>${c.BOWL}/${set.minBOWL}</b>Bowl</span>
      <span><b>${c.AR}/${set.minAR} ${c.WK}/${set.minWK}</b>AR and WK</span>
    </div>
    ${chips?`<div class="chips">${chips}</div>`:""}
  </div>`;
}
function viewRoundEnd(state,canControl){
  const unsoldList=state.unsold.map(pid=>{const p=byId(state,pid);
    return `<span class="chip">${swatch(p.team)}${esc(p.name)}, ${money(p.basePrice)}</span>`;}).join("");
  return `${header(state,`<button class="btn btn-sm" onclick="UI.pool=true;render()">Player pool</button>`)}
  <main>
  <section class="panel stack">
    <h2>Stumps on round ${state.round}</h2>
    <p class="muted">${state.sold.length} sold, ${state.unsold.length} passed in.</p>
    ${state.unsold.length?`<div class="chips">${unsoldList}</div>`:""}
    ${canControl?`<div class="row">
      ${state.unsold.length?`<button class="btn btn-lg" onclick="reauctionUnsold()">Re-auction the ${state.unsold.length} unsold</button>`:""}
      <button class="btn btn-primary btn-lg" onclick="finishAuction()">Lock in the squads</button>
      <button class="btn" ${state.sold.length?"":"disabled"} onclick="undoLast()">Undo last sale</button>
    </div>`:`<p class="muted">Waiting on the host.</p>`}
  </section>
  <h3 class="mt">The table</h3>
  <div class="board mt-s">${state.managers.map(m=>mgrCard(state,m,false)).join("")}</div>
  </main>`;
}

/* ---------- results ---------- */
function viewResults(state,canControl){
  const set=state.settings;
  const squads=state.managers.map(m=>{
    const c=roleCounts(state,m);
    const ok= m.squad.length>=set.squadSize && c.BAT>=set.minBAT&&c.BOWL>=set.minBOWL&&c.AR>=set.minAR&&c.WK>=set.minWK&&osCount(state,m)<=set.maxOverseas;
    const rows=m.squad.map(pid=>{const p=byId(state,pid);const s=state.sold.find(x=>x.playerId===pid);
      return `<tr><td><span class="row" style="gap:var(--s2);flex-wrap:nowrap">${swatch(p.team)}<span>${esc(p.name)}</span></span></td><td class="muted">${esc(p.team)}</td><td>${p.role}${p.overseas?", overseas":""}</td><td class="price">${money(s?s.price:0)}</td></tr>`;}).join("");
    return `<section class="panel mt">
      <div class="row between">
        <h3>${esc(m.name)} ${ok?"":`<span class="pill warn">Squad short</span>`}</h3>
        <span class="muted">Spent ${money(m.spent)}, ${money(set.budget-m.spent)} left, ${m.squad.length} of ${set.squadSize} players</span>
      </div>
      <div class="scroll mt-s"><table><thead><tr><th>Player</th><th>Club</th><th>Role</th><th>Price</th></tr></thead><tbody>${rows||`<tr><td colspan="4" class="muted">No players bought</td></tr>`}</tbody></table></div>
    </section>`;}).join("");
  const unsoldRows=state.unsold.map(pid=>{const p=byId(state,pid);
    return `<span class="chip">${swatch(p.team)}${esc(p.name)}</span>`;}).join("");
  return `${header(state)}
  <main>
  <section class="panel stack">
    <h1>Final squads</h1>
    <div class="row">
      <button class="btn btn-primary" onclick="exportCSV()">Download CSV</button>
      <button class="btn" onclick="exportJSON()">Download JSON</button>
      ${canControl?`<button class="btn" onclick="undoLast()" ${state.sold.length?"":"disabled"}>Undo last sale</button>
      <button class="btn btn-danger" onclick="restartAll()">Start a new auction</button>`:""}
    </div>
  </section>
  ${squads}
  ${state.unsold.length?`<section class="panel mt"><h3>Unsold, ${state.unsold.length}</h3><div class="chips">${unsoldRows}</div></section>`:""}
  </main>`;
}

/* ---------- player pool browser and editor ---------- */
function viewPool(state){
  const canEdit=UI.editPlayers && state.phase==="lobby" && NET.mode!=="client";
  let list=state.players.filter(p=>{
    if(UI.poolQ && !p.name.toLowerCase().includes(UI.poolQ.toLowerCase()))return false;
    if(UI.poolTeam && p.team!==UI.poolTeam)return false;
    if(UI.poolRole && p.role!==UI.poolRole)return false;
    if(UI.poolOS && !p.overseas)return false;
    return true;
  });
  list=UI.poolSort==="price"?[...list].sort((a,b)=>b.basePrice-a.basePrice):[...list].sort((a,b)=>a.name.localeCompare(b.name));
  const status=p=>{
    const s=state.sold.find(x=>x.playerId===p.id);
    if(s){const m=state.managers.find(x=>x.id===s.managerId);return `${esc(m?m.name:"?")}, ${money(s.price)}`;}
    if(state.unsold.includes(p.id))return `<span style="color:var(--danger)">Unsold</span>`;
    return `<span class="muted">Available</span>`;
  };
  const rows=list.map(p=>`<tr>
    <td><span class="row" style="gap:var(--s2);flex-wrap:nowrap;align-items:flex-start">${swatch(p.team)}<span>${esc(p.name)} ${p.unverified?`<span class="pill warn">Unverified</span>`:""}${p.note?`<span class="small muted" style="display:block">${esc(p.note)}</span>`:""}</span></span></td>
    <td class="muted">${esc(p.team)}</td><td>${p.role}${p.overseas?", overseas":""}</td>
    <td class="price">${canEdit?`<input type="number" step="0.5" min="1" value="${p.basePrice}" aria-label="Base price for ${esc(p.name)}" onchange="editPrice(${p.id},this.value)">`:money(p.basePrice)}</td>
    <td>${status(p)}</td>
    ${canEdit?`<td><button class="btn btn-quiet btn-sm" onclick="removePlayer(${p.id})" aria-label="Remove ${esc(p.name)}">Remove</button></td>`:""}
  </tr>`).join("");
  return `<div class="modal" onclick="if(event.target===this){UI.pool=false;UI.editPlayers=false;render()}">
    <div class="panel" role="dialog" aria-label="Player pool">
      <div class="row between">
        <h2>${canEdit?"Edit the pool":"Player pool"}</h2>
        <button class="btn btn-sm" onclick="UI.pool=false;UI.editPlayers=false;render()">Close</button>
      </div>
      <p class="small muted mt-s">Showing ${list.length} of ${state.players.length}. Data as of ${DATA_AS_OF}.</p>
      <div class="filters mt-s">
        <input aria-label="Search players" placeholder="Search by name" value="${esc(UI.poolQ)}" oninput="UI.poolQ=this.value;render();const i=document.querySelector('.filters input');i.focus();i.setSelectionRange(i.value.length,i.value.length)">
        <select aria-label="Club" onchange="UI.poolTeam=this.value;render()"><option value="">All clubs</option>
          ${Object.keys(TEAMS).map(t=>`<option ${UI.poolTeam===t?"selected":""}>${t}</option>`).join("")}</select>
        <select aria-label="Role" onchange="UI.poolRole=this.value;render()"><option value="">All roles</option>
          ${ROLES.map(r=>`<option ${UI.poolRole===r?"selected":""}>${r}</option>`).join("")}</select>
        <label class="check"><input type="checkbox" ${UI.poolOS?"checked":""} onchange="UI.poolOS=this.checked;render()"> Overseas only</label>
        <select aria-label="Sort" onchange="UI.poolSort=this.value;render()">
          <option value="price" ${UI.poolSort==="price"?"selected":""}>Dearest first</option>
          <option value="name" ${UI.poolSort==="name"?"selected":""}>A to Z</option></select>
      </div>
      ${canEdit?`<div class="addrow mt-s">
        <input id="npName" aria-label="New player name" placeholder="Add a player">
        <select id="npTeam" aria-label="New player club">${Object.keys(TEAMS).map(t=>`<option>${t}</option>`).join("")}</select>
        <select id="npRole" aria-label="New player role">${ROLES.map(r=>`<option>${r}</option>`).join("")}</select>
        <label class="check"><input id="npOS" type="checkbox"> Overseas</label>
        <input id="npPrice" aria-label="New player base price" type="number" step="0.5" min="1" value="5">
        <button class="btn btn-primary btn-sm" onclick="addPlayer()">Add</button>
      </div>`:""}
      <div class="scroll mt-s" style="max-height:60vh;overflow-y:auto">
        <table><thead><tr><th>Player</th><th>Club</th><th>Role</th><th>Base</th><th>Status</th>${canEdit?"<th></th>":""}</tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>
  </div>`;
}
function editPrice(pid,v){ const p=byId(S,pid); if(p){p.basePrice=Math.max(1,parseFloat(v)||p.basePrice); sync();} }
function removePlayer(pid){ S.players=S.players.filter(p=>p.id!==pid); sync(); }
function addPlayer(){
  const name=document.getElementById("npName").value.trim(); if(!name)return;
  S.players.push({id:Math.max(0,...S.players.map(p=>p.id))+1, name,
    team:document.getElementById("npTeam").value, role:document.getElementById("npRole").value,
    overseas:document.getElementById("npOS").checked, basePrice:Math.max(1,parseFloat(document.getElementById("npPrice").value)||5)});
  sync();
}

/* Timer urgency: the last five seconds turn the clock red. */
function tickUrgency(){
  const state=st(), lot=document.getElementById("lot");
  if(!lot||!state||!state.current||!state.current.deadline)return;
  const left=state.current.deadline-Date.now();
  if(left<=5000) lot.setAttribute("data-urgent",""); else lot.removeAttribute("data-urgent");
}
setInterval(tickUrgency,250);

/* ================= THE BALL (one 3D moment, home screen only) =================
   A white Kookaburra-style ball built in code: leather sphere with a generated grain map,
   a raised seam and six rows of instanced stitches. Three.js is lazy-loaded from a CDN.
   If it fails to load, or WebGL is refused, the inline SVG below stays in place. */
const BALL_SVG = `<svg viewBox="0 0 200 200" role="img" aria-label="Cricket ball">
  <circle cx="100" cy="100" r="88" fill="#e9e4d6"/>
  <path d="M100 12a88 88 0 0 1 0 176a120 120 0 0 0 0-176z" fill="#cfc9b8"/>
  <g fill="none" stroke="#8d8672" stroke-width="2.5">
    <path d="M70 18c-26 50-26 114 0 164"/><path d="M84 13c-24 54-24 120 0 174"/><path d="M98 12c-22 56-22 120 0 176"/>
  </g>
  <g fill="none" stroke="#6f6956" stroke-width="2" stroke-dasharray="3 6">
    <path d="M63 22c-27 49-27 107 0 156"/><path d="M77 15c-25 53-25 117 0 170"/><path d="M91 12c-23 56-23 120 0 176"/><path d="M105 12c-22 56-22 120 0 176"/>
  </g>
</svg>`;
const BALL = (function(){
  const SOURCES=["https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js","https://unpkg.com/three@0.128.0/build/three.min.js"];
  let canvas=null, renderer=null, scene=null, camera=null, ball=null, raf=0, last=0, spin=0.45, loading=false, failed=false, visible=true;
  function loadThree(i,done){
    if(window.THREE)return done(true);
    if(i>=SOURCES.length)return done(false);
    const s=document.createElement("script"); s.src=SOURCES[i]; s.async=true;
    s.onload=()=>done(!!window.THREE); s.onerror=()=>loadThree(i+1,done);
    document.head.appendChild(s);
  }
  function rng(seed){ let x=seed; return ()=>{ x=(x*1664525+1013904223)%4294967296; return x/4294967296; }; }
  function leatherMaps(){
    const T=window.THREE, r=rng(16), w=1024, h=512;
    const c=document.createElement("canvas"); c.width=w; c.height=h; const g=c.getContext("2d");
    g.fillStyle="#ece7d9"; g.fillRect(0,0,w,h);
    for(let i=0;i<9000;i++){ g.fillStyle=r()<.5?"rgba(120,112,92,.10)":"rgba(255,255,255,.14)"; g.fillRect(r()*w,r()*h,1+r()*2,1+r()*2); }
    const scuffs=[["rgba(86,120,70,.16)",6],["rgba(140,96,70,.14)",7],["rgba(60,60,60,.08)",8]];
    scuffs.forEach(([col,n])=>{ for(let i=0;i<n;i++){ g.fillStyle=col; g.beginPath(); g.ellipse(r()*w,r()*h,20+r()*70,6+r()*18,r()*3.14,0,6.283); g.fill(); } });
    g.fillStyle="#1f4a37"; g.font="700 46px Arial, sans-serif"; g.textAlign="center";
    g.fillText("BIDBASH",w*0.25,h*0.30); g.font="700 20px Arial, sans-serif"; g.fillText("156 g  TURF",w*0.25,h*0.30+30);
    const b=document.createElement("canvas"); b.width=512; b.height=256; const bg=b.getContext("2d");
    bg.fillStyle="#808080"; bg.fillRect(0,0,512,256);
    for(let i=0;i<14000;i++){ const v=110+Math.floor(r()*60); bg.fillStyle="rgb("+v+","+v+","+v+")"; bg.fillRect(r()*512,r()*256,1.5,1.5); }
    const map=new T.CanvasTexture(c), bump=new T.CanvasTexture(b);
    if(renderer.capabilities.getMaxAnisotropy) map.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());
    return {map,bump};
  }
  function build(){
    const T=window.THREE;
    renderer=new T.WebGLRenderer({antialias:true,alpha:true,powerPreference:"low-power"});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    canvas=renderer.domElement;
    scene=new T.Scene();
    camera=new T.PerspectiveCamera(32,1,0.1,20); camera.position.set(0,0,4.6);
    scene.add(new T.HemisphereLight(0xfff6e0,0x1a1c1b,0.55));
    const key=new T.DirectionalLight(0xffffff,1.05); key.position.set(-2.4,3,3.2); scene.add(key);
    const rim=new T.DirectionalLight(0xf5d21f,0.9); rim.position.set(3,-0.6,-2.5); scene.add(rim);
    ball=new T.Group();
    const maps=leatherMaps();
    ball.add(new T.Mesh(new T.SphereGeometry(1,64,48),new T.MeshStandardMaterial({map:maps.map,bumpMap:maps.bump,bumpScale:0.012,roughness:0.62,metalness:0})));
    const seamMat=new T.MeshStandardMaterial({color:0xd8d1bd,roughness:0.8});
    [0,-0.045,0.045].forEach((y,i)=>{
      const rad=Math.sqrt(1-y*y);
      const ridge=new T.Mesh(new T.TorusGeometry(rad+0.004,i===0?0.02:0.012,10,128),seamMat);
      ridge.rotation.x=Math.PI/2; ridge.position.y=y; ball.add(ridge);
    });
    const rows=[-0.13,-0.095,-0.06,0.06,0.095,0.13], per=96;
    const stitches=new T.InstancedMesh(new T.CylinderGeometry(0.0065,0.0065,0.034,6),new T.MeshStandardMaterial({color:0xbdb59e,roughness:0.9}),rows.length*per);
    const d=new T.Object3D(); let n=0;
    rows.forEach((y,ri)=>{
      const rad=Math.sqrt(1-y*y);
      for(let k=0;k<per;k++){
        const a=(k+(ri%2)*0.5)/per*Math.PI*2;
        d.position.set(Math.cos(a)*rad*1.006,y,Math.sin(a)*rad*1.006);
        d.lookAt(0,0,0); d.rotateZ(y>0?0.55:-0.55); d.updateMatrix();
        stitches.setMatrixAt(n++,d.matrix);
      }
    });
    ball.add(stitches);
    ball.rotation.set(0.35,0.6,-1.05);
    scene.add(ball);
    canvas.addEventListener("pointerdown",()=>{ spin=4.5; start(); });
    if(window.IntersectionObserver) new IntersectionObserver(es=>{ visible=es[0].isIntersecting; if(visible)start(); }).observe(canvas);
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden)start(); });
    window.addEventListener("resize",size);
  }
  function size(){
    if(!canvas||!canvas.parentNode)return;
    const w=canvas.parentNode.clientWidth||300;
    renderer.setSize(w,w,false);
  }
  function frame(t){
    raf=0;
    if(!canvas.isConnected||document.hidden||!visible)return;
    const dt=Math.min(0.05,(t-last)/1000||0.016); last=t;
    spin+=(0.45-spin)*Math.min(1,dt*1.6);
    ball.rotateOnWorldAxis(AXIS,spin*dt);
    renderer.render(scene,camera);
    if(!REDUCED) raf=requestAnimationFrame(frame);
  }
  let AXIS=null;
  function start(){ if(!raf&&canvas&&canvas.isConnected){ last=performance.now(); raf=requestAnimationFrame(frame); } }
  function attach(){
    const stage=document.getElementById("ballstage");
    if(!stage||!canvas)return;
    stage.innerHTML=""; stage.appendChild(canvas); size(); start();
  }
  function mount(){
    if(failed)return;
    if(canvas)return attach();
    if(loading)return;
    loading=true;
    const go=()=>loadThree(0,ok=>{
      loading=false;
      if(!ok){ failed=true; return; }
      try{ build(); AXIS=new window.THREE.Vector3(0.25,1,0).normalize(); attach(); }
      catch(e){ failed=true; canvas=null; }
    });
    if(window.requestIdleCallback) requestIdleCallback(go,{timeout:1500}); else setTimeout(go,200);
  }
  return {mount};
})();

/* ================= BOOT ================= */
window.addEventListener("load",()=>{
  if(location.hash && location.hash.length>3 && peerAvailable() && !st()){ goJoin(); }
});
render();
