<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c0e0d">
<meta name="description" content="BidBash: a live Big Bash League auction room. Host a room, share the code, bid for BBL|16 squads with your mates.">
<title>BidBash: BBL|16 Auction Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js" onerror="window.MQTT_CDN1_FAILED=true"></script>
<script>if(window.MQTT_CDN1_FAILED){document.write('<script src="https:\/\/unpkg.com\/mqtt@5.10.1\/dist\/mqtt.min.js" onerror="window.MQTT_FAILED=true"><\/script>')}</script>
<style>
/* One system: scoreboard black, warm white, floodlight yellow. Flat fills, hard edges, no gradients.
   Spacing scale: 4 8 12 16 24 32 48 64. Type scale: 13 15 18 24 36 56 and the fluid scoreboard sizes. */
:root{
  --bg:#0c0e0d; --surface:#161918; --raised:#202422; --line:#373d39;
  --text:#f4f2ea; --muted:#a9aea8;
  --accent:#f5d21f; --accent-hi:#ffe45c; --accent-lo:#8f7a00; --accent-ink:#151300;
  --danger:#ff5a3c; --ok:#5fd38d;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r:4px;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);font-size:15px;line-height:1.45;background:var(--bg);color:var(--text);min-height:100vh}
#app{max-width:1240px;margin:0 auto;padding:var(--s4) var(--s4) var(--s8)}
h1,h2,h3,.display{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1}
h1{font-size:56px} h2{font-size:36px} h3{font-size:24px}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.label{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:var(--s4)}
.mt{margin-top:var(--s5)} .mt-s{margin-top:var(--s3)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Buttons: a physical key. It lifts on hover and goes down on press. */
.btn{
  font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase;
  min-height:48px;padding:0 var(--s5);border-radius:var(--r);cursor:pointer;
  background:var(--raised);color:var(--text);border:1px solid var(--line);
  box-shadow:0 3px 0 #000;transform:translateY(0);
  transition:transform .08s ease-out,box-shadow .08s ease-out,background-color .12s;
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);text-align:center;
}
.btn:hover:not(:disabled){background:#2a2f2c;transform:translateY(-1px);box-shadow:0 4px 0 #000}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 #000}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 3px 0 var(--accent-lo)}
.btn-primary:hover:not(:disabled){background:var(--accent-hi);box-shadow:0 4px 0 var(--accent-lo)}
.btn-primary:active:not(:disabled){box-shadow:0 0 0 var(--accent-lo)}
.btn-primary:focus-visible{outline-color:var(--text)}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-quiet{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
.btn-quiet:hover:not(:disabled){background:var(--raised);box-shadow:none;color:var(--text);transform:none}
.btn-quiet:active:not(:disabled){transform:translateY(1px)}
.btn-lg{min-height:60px;font-size:24px;padding:0 var(--s6)}
.btn-block{width:100%}
.btn-sm{min-height:44px;font-size:15px;padding:0 var(--s3)}

input,select{
  font-family:var(--body);font-size:16px;background:var(--bg);color:var(--text);
  border:1px solid var(--line);border-radius:var(--r);min-height:48px;padding:0 var(--s3);width:100%;
}
input:hover,select:hover{border-color:#59605b}
input[type=number]{width:96px}
input[type=checkbox]{width:24px;min-height:24px;height:24px;accent-color:var(--accent);padding:0}
.field{display:grid;gap:var(--s1)}
.field>span{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5)}
.panel-narrow{max-width:520px;margin:var(--s7) auto 0}
.notice{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s4);font-size:13px;color:var(--muted)}
.notice.bad{border-color:var(--danger);color:var(--text)}

/* Top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap;padding-bottom:var(--s4);margin-bottom:var(--s5);border-bottom:1px solid var(--line)}
.wordmark{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.04em;text-transform:uppercase}
.wordmark b{color:var(--accent);font-weight:800}
.codechip{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.14em;background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r);min-height:44px;padding:0 var(--s3);cursor:pointer;transition:transform .08s}
.codechip:hover{background:var(--accent-hi)} .codechip:active{transform:translateY(2px)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--ok)}
.dot.off{background:var(--danger)}

/* Home */
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s7);align-items:center;min-height:calc(100vh - 96px)}
.home h1{font-size:clamp(72px,13vw,176px);letter-spacing:-.01em;line-height:.86}
.home h1 b{color:var(--accent);font-weight:800}
.home .lede{font-size:24px;line-height:1.25;max-width:22ch;margin-top:var(--s4);font-weight:500}
.home .actions{display:grid;gap:var(--s3);max-width:380px;margin-top:var(--s6)}
.home .facts{margin-top:var(--s5);color:var(--muted);font-size:13px;max-width:44ch}
.ballstage{aspect-ratio:1;width:100%;max-width:560px;justify-self:center;position:relative}
.ballstage canvas,.ballstage svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Room code as scoreboard cells */
.codecells{display:flex;gap:var(--s2);justify-content:center;cursor:pointer;background:none;border:0;width:100%}
.codecells span{font-family:var(--display);font-weight:800;font-size:clamp(48px,11vw,96px);line-height:1;background:var(--bg);color:var(--accent);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s4);min-width:1.1em;text-align:center;transition:transform .08s}
.codecells:active span{transform:translateY(3px)}

/* The lot: who is under the hammer. Built to be read from the couch. */
.lot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lot-band{background:var(--club);color:var(--club-ink);display:flex;gap:var(--s2) var(--s5);align-items:center;flex-wrap:wrap;padding:var(--s3) var(--s5);font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase}
.lot-band .grow{flex:1}
.lot-body{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:var(--s6);padding:var(--s6) var(--s5);align-items:end}
.lot-name{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(48px,8.4vw,128px);line-height:.88;letter-spacing:-.01em;overflow-wrap:anywhere}
.lot-note{margin-top:var(--s3);color:var(--muted);max-width:46ch}
.lot-note b{color:var(--text)}
.score{text-align:right}
.score .amt{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(88px,15vw,208px);line-height:.82;color:var(--accent)}
.score .leader{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.4vw,44px);text-transform:uppercase;letter-spacing:.02em;margin-top:var(--s2);overflow-wrap:anywhere}
.score .leader.none{color:var(--muted)}
.clock{display:flex;align-items:center;gap:var(--s4);padding:0 var(--s5) var(--s5)}
.clock .secs{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;font-size:56px;line-height:1;min-width:2.4ch}
.clock .track{flex:1;height:16px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.clock .bar{height:100%;background:var(--accent);transition:width .25s linear}
.lot[data-urgent] .clock .secs{color:var(--danger)}
.lot[data-urgent] .clock .bar{background:var(--danger)}
.lot-actions{border-top:1px solid var(--line);padding:var(--s5);display:grid;gap:var(--s4)}
.bidgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s3)}
.bid{min-height:88px;flex-direction:column;gap:0;font-size:36px;line-height:1}
.bid small{font-family:var(--body);font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;opacity:.85;margin-top:var(--s1)}
.bid .who{font-size:18px;letter-spacing:.06em}
.bid-solo{min-height:104px;font-size:56px;width:100%;max-width:560px;margin:0 auto}
.bid.leading{background:var(--surface);color:var(--accent);border-color:var(--accent);box-shadow:none;opacity:1}
.hostbar{display:flex;gap:var(--s3);flex-wrap:wrap;justify-content:center}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.score .amt.bump{animation:bump .22s ease-out}

/* Manager board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--s3)}
.mgr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4)}
.mgr.lead{outline:2px solid var(--accent);outline-offset:-2px}
.mgr-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2)}
.mgr-name{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;overflow-wrap:anywhere}
.mgr-left{font-family:var(--display);font-weight:800;font-size:36px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.mgr-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-top:var(--s3);font-size:13px;color:var(--muted)}
.mgr-stats b{display:block;color:var(--text);font-family:var(--display);font-size:18px;font-weight:700}
.tagline{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.you{background:var(--text);color:var(--bg);padding:0 var(--s1);border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:var(--s3)}
.chip{font-size:13px;background:var(--raised);border-radius:2px;padding:2px var(--s2) 2px 2px;display:inline-flex;align-items:center;gap:var(--s2)}
.sw{width:16px;height:16px;border-radius:2px;background:var(--club,#777);display:inline-block;flex:none}
.pill{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:2px;padding:0 var(--s1)}
.pill.warn{color:var(--danger)}

table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.price{font-family:var(--display);font-weight:700;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s4)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:flex-start;justify-content:center;padding:var(--s5) var(--s3);z-index:50;overflow:auto}
.modal .panel{max-width:960px;width:100%}
.filters{display:grid;grid-template-columns:2fr 1.4fr 1fr auto 1fr;gap:var(--s3);align-items:center}
.addrow{display:grid;grid-template-columns:2fr 1.4fr 1fr auto 96px auto;gap:var(--s3);align-items:center}
.check{display:inline-flex;align-items:center;gap:var(--s2);font-size:13px;color:var(--muted);white-space:nowrap}

#toasts{position:fixed;top:var(--s4);left:50%;transform:translateX(-50%);z-index:99;display:grid;gap:var(--s2);justify-items:center;width:min(92vw,560px);pointer-events:none}
.toast{background:var(--text);color:var(--bg);font-weight:600;padding:var(--s3) var(--s4);border-radius:var(--r);text-align:center;animation:drop .16s ease-out}
@keyframes drop{from{transform:translateY(-8px)}to{transform:none}}
#stamp{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);pointer-events:none;padding:var(--s4)}
#stamp.on{display:flex}
#stamp .stampwrap{position:relative}
#stamp .ink{border:8px solid var(--danger);color:var(--danger);border-radius:var(--r);padding:var(--s4) var(--s6);text-align:center;transform:rotate(-6deg);background:var(--bg);visibility:hidden}
#stamp.hit .ink{visibility:visible;animation:thump .28s cubic-bezier(.2,1.4,.4,1)}
#stamp.hit .stampwrap{animation:shake .22s linear}
#stamp .word{font-family:var(--display);font-weight:800;font-size:clamp(96px,22vw,260px);line-height:.85;letter-spacing:.02em}
#stamp .line{font-family:var(--display);font-weight:700;font-size:clamp(18px,3.2vw,36px);text-transform:uppercase;color:var(--text);margin-top:var(--s2)}
@keyframes thump{from{transform:rotate(-6deg) scale(1.5)}to{transform:rotate(-6deg) scale(1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateY(6px)}60%{transform:translateY(-2px)}}
/* The gavel sits off the top right corner of the stamp and strikes its edge. Purely decorative. */
.gavelstage{--gw:clamp(190px,34vw,380px);position:absolute;width:var(--gw);height:var(--gw);left:calc(72% - var(--gw)*.26);top:calc(var(--gw)*-.67 + 20px);pointer-events:none}
.gavelstage canvas,.gavelstage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.gavelstage .gv{transform-box:view-box;transform-origin:186px 70px}
#stamp.swing .gavelstage .gv{animation:swing .3s cubic-bezier(.55,0,1,.45) both}
@keyframes swing{from{transform:rotate(-52deg)}to{transform:rotate(0)}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Typed bids */
.bidrow{display:grid;gap:var(--s3);justify-items:center}
.quick{display:flex;gap:var(--s3);justify-content:center;flex-wrap:wrap}
.quick .btn{min-width:120px;font-size:24px}
.typebid{display:flex;gap:var(--s3);align-items:flex-end;justify-content:center;flex-wrap:wrap;max-width:560px;margin:0 auto;width:100%}
.typebid .grow{flex:1;min-width:160px}
.typebid select{width:auto;min-width:140px}
.money-in{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:var(--r)}
.money-in:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.money-in b{font-family:var(--display);font-size:24px;color:var(--muted);padding-left:var(--s3)}
.money-in input{border:0;font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;outline:none;padding-left:var(--s2)}
.bidhelp{text-align:center;color:var(--muted);font-size:13px}
.bidhelp b{color:var(--text);font-family:var(--display);font-size:18px}
.biderr{text-align:center;color:var(--text);background:var(--raised);border:1px solid var(--danger);border-radius:var(--r);padding:var(--s2) var(--s3);max-width:560px;margin:0 auto;font-weight:600}
.clock .going{font-family:var(--display);font-weight:800;font-size:36px;text-transform:uppercase;letter-spacing:.04em;color:var(--danger);min-width:6.4ch;text-align:right}


/* League: tabs, table, the field, cards, bench */
.lgname{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
a.wordmark{color:var(--text);text-decoration:none}
.tabs{display:flex;gap:var(--s1);overflow-x:auto;margin:calc(var(--s5)*-1) 0 var(--s5);padding:var(--s2) 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;background:none;border:0;color:var(--muted);min-height:44px;padding:0 var(--s3);border-radius:var(--r);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text);background:var(--raised)}
.tab.on{color:var(--accent-ink);background:var(--accent)}
.linkbtn{background:none;border:0;color:var(--text);font:inherit;font-weight:600;cursor:pointer;padding:var(--s1) 0;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linkbtn:hover{text-decoration-color:var(--accent)}
td.num,th.num{text-align:right;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:18px}
td.big{font-size:24px;color:var(--accent)}
.bad-text{color:var(--danger)}
.teamgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--s4);align-items:start}
.pitchwrap{background:#0f2418;border:1px solid #23412f;border-radius:var(--r);padding:var(--s4);position:relative;overflow:hidden}
/* Subtle pitch markings: a boundary oval and the 22 yard strip, drawn with borders only. */
.pitchwrap::before{content:"";position:absolute;inset:4% 3%;border:2px solid rgba(244,242,234,.07);border-radius:50%;pointer-events:none}
.pitchwrap::after{content:"";position:absolute;left:50%;top:22%;width:46px;height:56%;transform:translateX(-50%);background:#16301f;border:1px solid rgba(244,242,234,.06);pointer-events:none}
.pitch{position:relative;z-index:1;display:grid;gap:var(--s4)}
.pgroup{display:grid;gap:var(--s2);justify-items:center}
.pillhead{display:inline-flex;align-items:center;gap:var(--s3);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:var(--s1) var(--s4);font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.pillhead b{color:var(--accent);font-variant-numeric:tabular-nums}
.pcards{display:flex;flex-wrap:wrap;gap:var(--s2);justify-content:center;width:100%}
.pcards.col{flex-direction:column;align-items:stretch}
.pcard{position:relative;display:grid;gap:2px;text-align:left;width:164px;min-height:88px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-left:6px solid var(--club);border-radius:var(--r);padding:var(--s2) var(--s3);cursor:pointer;box-shadow:0 2px 0 #000;transition:transform .08s ease-out}
.pcards.col .pcard{width:auto}
.pcard:hover{transform:translateY(-1px)}
.pcard:active{transform:translateY(2px);box-shadow:none}
.pcard.sel{outline:3px solid var(--accent);outline-offset:1px}
.pname{font-family:var(--display);font-weight:800;font-size:18px;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.pmeta{font-size:13px;color:var(--muted)}
.ppts{display:flex;gap:var(--s3);font-size:13px;color:var(--muted)}
.ppts b{font-family:var(--display);font-size:18px;color:var(--text);font-variant-numeric:tabular-nums}
.eorder{position:absolute;top:var(--s1);right:var(--s2);font-family:var(--display);font-weight:800;font-size:15px;color:var(--accent)}
.empty{color:var(--muted);font-size:13px;padding:var(--s3)}
.pitchfoot{display:flex;gap:var(--s3);justify-content:center;align-items:center;flex-wrap:wrap;font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.pitchfoot b{color:var(--accent)}
.pitchfoot .small{font-family:var(--body);text-transform:none;letter-spacing:0;color:var(--text);font-weight:500}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);display:grid;gap:var(--s3)}
.actionbar{position:sticky;bottom:var(--s3);z-index:5;display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;background:var(--raised);border:1px solid var(--accent);border-radius:var(--r);padding:var(--s3)}
.actionbar .small{flex:1 1 220px}
.fixtures{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--s3)}
.fixture{display:grid;gap:var(--s1);text-align:left;background:var(--raised);color:var(--text);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3);cursor:pointer;font:inherit}
.fixture:hover{border-color:#59605b}
.ftitle{font-family:var(--display);font-weight:800;font-size:18px;text-transform:uppercase}
.livetag{color:var(--danger)}
.votes{display:flex;flex-wrap:wrap;gap:var(--s2)}
.trades,.log{list-style:none;display:grid;gap:var(--s2)}
.trade{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);align-items:center;background:var(--raised);border-radius:var(--r);padding:var(--s3)}
.trade>span:first-child{flex:1 1 280px}
.log li{display:grid;grid-template-columns:150px 1fr;gap:var(--s3);padding:var(--s2) 0;border-bottom:1px solid var(--line)}
.tradecols{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.tradecols .check{display:flex;white-space:normal;font-size:15px;color:var(--text);min-height:36px}
.scoregrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--s5)}
details summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
@media (max-width:820px){
  .teamgrid{grid-template-columns:1fr}
  .pcard{width:calc(50% - var(--s1));min-width:0}
  .pitchwrap{padding:var(--s3)}
  .log li{grid-template-columns:1fr;gap:0}
  .tradecols{grid-template-columns:1fr}
  .tabs{margin-top:calc(var(--s4)*-1)}
}
@media (max-width:820px){
  h1{font-size:36px} h2{font-size:24px}
  .home{grid-template-columns:1fr;gap:var(--s4);min-height:0;padding-top:var(--s4)}
  .ballstage{max-width:240px;order:-1;justify-self:start}
  .home .actions{max-width:none}
  .lot-band{font-size:18px;padding:var(--s3) var(--s4);gap:var(--s3)}
  .lot-body{grid-template-columns:1fr;gap:var(--s4);padding:var(--s5) var(--s4)}
  .score{text-align:left}
  .clock{padding:0 var(--s4) var(--s4);flex-wrap:wrap} .clock .secs{font-size:36px}
  .clock .going{font-size:24px;min-width:0}
  .quick .btn{min-width:0;flex:1}
  .lot-actions{padding:var(--s4)}
  .bidgrid{grid-template-columns:1fr 1fr}
  .bid{min-height:72px;font-size:24px}
  .bid-solo{min-height:88px;font-size:36px}
  .filters,.addrow{grid-template-columns:1fr 1fr}
  .panel{padding:var(--s4)}
  .hostbar .btn{flex:1 1 44%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

}
function newState(managers, settings){
  return {
    phase:"lobby", settings,
    players: JSON.parse(JSON.stringify(PLAYERS)),
    managers, queue:[], qIndex:0, current:null,
    sold:[], unsold:[], round:1,
    paused:false, saleSeq:0, lastSale:null
  };
}
function makeManager(id,name){ return {id, name, squad:[], spent:0, connected:true, cid:null}; }

/* ================= HELPERS: rules & validation ================= */
const remBudget = m => st().settings.budget - m.spent;
function roleCounts(state,m){
  const c={BAT:0,BOWL:0,AR:0,WK:0};
  m.squad.forEach(pid=>{const p=byId(state,pid); if(p)c[p.role]++});
  return c;
}
const osCount=(state,m)=>m.squad.filter(pid=>{const p=byId(state,pid);return p&&p.overseas}).length;
function minPoolPrice(state){
  let min=Infinity;
  for(const p of state.players){
    if(!state.sold.some(s=>s.playerId===p.id)) min=Math.min(min,p.basePrice);
  }
  return isFinite(min)?min:4;
}
// Returns null if manager may bid `price` for `player`, else a reason string.
function bidBlockReason(state,m,player,price){
  const set=state.settings;
  if(m.squad.length>=set.squadSize) return "Squad full";
  if(price>state.settings.budget-m.spent) return "Not enough budget";
  if(player.overseas && osCount(state,m)>=set.maxOverseas) return "Overseas quota full";
  const slotsAfter=set.squadSize-m.squad.length-1;
  const reserve=slotsAfter*minPoolPrice(state);
  if(price>(set.budget-m.spent)-reserve) return "Must keep "+money(reserve)+" for remaining slots";
  const c=roleCounts(state,m); c[player.role]++;
  const needed=Math.max(0,set.minBAT-c.BAT)+Math.max(0,set.minBOWL-c.BOWL)+Math.max(0,set.minAR-c.AR)+Math.max(0,set.minWK-c.WK);
  if(needed>slotsAfter) return "Would make role minimums impossible";
  return null;
}
function nextBid(state){
  const cur=state.current;
  const p=byId(state,cur.playerId);
  return cur.bidderId==null ? p.basePrice : Math.round((cur.bid+state.settings.increment)*100)/100;
}
/* Typed bids: amounts snap to the nearest 0.25. */
const q25 = n => Math.round(n*4)/4;
const bidRef = state => state&&state.current ? state.current.playerId+":"+state.current.bid+":"+state.current.bidderId : "";
// The most this manager may bid on this player right now. {max, reason}: max is 0 when any bid is blocked.
function maxBid(state,m,player){
  const set=state.settings;
  const slotsAfter=Math.max(0,set.squadSize-m.squad.length-1);
  const max=Math.floor(((set.budget-m.spent)-slotsAfter*minPoolPrice(state))*4+1e-9)/4;
  const reason=bidBlockReason(state,m,player,Math.max(0,max));
  return reason||max<=0 ? {max:0,reason:reason||"No purse left for this lot"} : {max,reason:null};
}
// Client-side and host-side check of one typed amount. Returns an error string or null.
function bidError(state,m,amount,seenRef){
  if(state.paused) return "Bidding is paused by the host.";
  const cur=state.current; if(!cur) return "Nobody is under the hammer.";
  if(cur.bidderId===m.id) return "You already lead at "+money(cur.bid)+".";
  if(!isFinite(amount)||amount<=0) return "Type an amount in dollars, like 9.5.";
  const min=nextBid(state);
  if(amount<min){
    const lead=cur.bidderId!=null?state.managers.find(x=>x.id===cur.bidderId):null;
    if(seenRef!=null&&seenRef!==bidRef(state)&&lead) return "Outbid: "+lead.name+" is on "+money(cur.bid)+". The least you can bid now is "+money(min)+".";
    return "Too low. The least you can bid is "+money(min)+".";
  }
  const p=byId(state,cur.playerId);
  const block=bidBlockReason(state,m,p,amount);
  if(block){
    const mx=maxBid(state,m,p);
    return mx.max>=min ? "Over your max. The most you can bid is "+money(mx.max)+"." : "Bid blocked: "+block+".";
  }
  return null;
}

/* ================= NETWORKING (MQTT over public brokers) ================= */
const peerAvailable = () => !window.MQTT_FAILED && typeof mqtt!=="undefined";
const BROKERS = ["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt","wss://test.mosquitto.org:8081"];
const topicRoot = code => "bbl15auction/"+code.toUpperCase();
const myCid = "c"+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
function genCode(){
  const chars="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let c="";
  for(let i=0;i<5;i++)c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}
// Connect to the first reachable broker, then call onReady(client).
function netConnect(brokerIdx,will,onReady){
  if(brokerIdx>=BROKERS.length){ NET.status="Couldn't reach any relay server: check your internet."; render(); return; }
  NET.status=brokerIdx===0?"Connecting…":"Trying backup server…"; render();
  const client=mqtt.connect(BROKERS[brokerIdx],{
    clientId:"bbl15_"+myCid, clean:true, connectTimeout:7000, reconnectPeriod:2000,
    will:will||undefined
  });
  let opened=false;
  client.on("connect",()=>{
    if(!opened){ opened=true; NET.client=client; onReady(client); }
    else { NET.status="live"; render(); } // reconnect after drop
  });
  client.on("offline",()=>{ if(opened){ NET.status="Reconnecting…"; render(); } });
  client.on("error",()=>{ if(!opened){ client.end(true); netConnect(brokerIdx+1,will,onReady); } });
  setTimeout(()=>{ if(!opened){ try{client.end(true);}catch(e){} netConnect(brokerIdx+1,will,onReady); } },8000);
}
const pub=(topic,obj,retain)=>{ try{ NET.client&&NET.client.publish(topic,JSON.stringify(obj),{retain:!!retain}); }catch(e){} };
function packState(){ return JSON.parse(JSON.stringify(S)); }

function hostRoom(code){
  NET.mode="host"; NET.code=code.toUpperCase();
  const T=topicRoot(NET.code);
  netConnect(0,null,client=>{
    NET.status="live";
    localStorage.setItem(LS_NET,JSON.stringify({mode:"host",code:NET.code,name:NET.myName}));
    client.subscribe(T+"/h");
    client.on("message",(topic,buf)=>{
      if(topic!==T+"/h")return;
      let msg; try{ msg=JSON.parse(buf.toString()); }catch(e){ return; }
      hostOnMessage(msg);
    });
    sync();
  });
}
function hostOnMessage(msg){
  if(!msg||typeof msg!=="object"||!msg.cid)return;
  if(msg.t==="ping"){ pub(topicRoot(NET.code)+"/c/"+msg.cid,{t:"pong",c:msg.c,h:Date.now()}); return; }
  if(msg.t==="join"){
    const name=String(msg.name||"").trim().slice(0,20)||"Player";
    let m=S.managers.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(m&&m.cid===msg.cid&&m.connected){ pub(topicRoot(NET.code)+"/c/"+msg.cid,{t:"you",id:m.id}); return; }
    if(!m){
      if(S.phase!=="lobby"||S.window){ pub(topicRoot(NET.code)+"/c/"+msg.cid,{t:"spectator"}); return; }
      if(S.managers.length>=10){ pub(topicRoot(NET.code)+"/c/"+msg.cid,{t:"err",msg:"Room is full (10 managers max)"}); return; }
      m=makeManager(Math.max(0,...S.managers.map(x=>x.id))+1,name);
      S.managers.push(m);
      toast(name+" joined the room");
    } else {
      toast(name+" reconnected");
    }
    m.connected=true; m.cid=msg.cid;
    pub(topicRoot(NET.code)+"/c/"+msg.cid,{t:"you",id:m.id});
    sync();
    return;
  }
  if(msg.t==="leave"){
    const m=S.managers.find(x=>x.cid===msg.cid);
    if(m&&m.connected){ m.connected=false; toast(m.name+" disconnected"); sync(); }
    return;
  }
  if(msg.t==="bid"){
    // Messages arrive one at a time, so two bids at once are judged in arrival order.
    // An old client sends no amount and gets the minimum raise.
    const m=S.managers.find(x=>x.cid===msg.cid);
    if(m)placeBid(m.id,msg.amount,msg.ref);
    return;
  }
}
function sendToManager(m,obj){ if(m&&m.cid)pub(topicRoot(NET.code)+"/c/"+m.cid,obj); }
function sync(){
  if(NET.mode==="host"||NET.mode==="local"){
    try{ localStorage.setItem(LS_STATE,JSON.stringify({net:{mode:NET.mode,code:NET.code,myName:NET.myName},state:packState()})); }catch(e){}
  }
  if(NET.mode==="host") pub(topicRoot(NET.code)+"/s",{t:"state",state:packState(),now:Date.now()},true);
  render();
}
/* Clock sync, NTP style. Each client pings the host every 5s; the host answers with its clock.
   offset = hostTime - (sent + roundTrip/2), and the sample with the shortest round trip wins,
   so every screen counts down to the host's deadline. */
const skew={best:Infinity,offset:0,at:0};
function skewPong(sent,hostNow){
  const now=Date.now(), rtt=now-sent;
  if(rtt<0||rtt>10000)return;
  if(rtt<=skew.best||now-skew.at>60000){ skew.best=rtt; skew.offset=hostNow-(sent+rtt/2); skew.at=now; }
}
const nowAdj = () => NET.mode==="client" ? Date.now()+skew.offset : Date.now();
setInterval(()=>{ if(NET.mode==="client"&&NET.client&&NET.code) pub(topicRoot(NET.code)+"/h",{t:"ping",cid:myCid,c:Date.now()}); },5000);
let roomWait=null;
function joinRoom(code,name){
  NET.mode="client"; NET.code=code.toUpperCase(); NET.myName=name;
  const T=topicRoot(NET.code);
  netConnect(0,{topic:T+"/h",payload:JSON.stringify({t:"leave",cid:myCid}),qos:0,retain:false},client=>{
    NET.status="live";
    client.subscribe([T+"/s",T+"/c/"+myCid,T+"/toast",T+"/e"]);
    pub(T+"/h",{t:"ping",cid:myCid,c:Date.now()});
    client.on("message",(topic,buf)=>{
      let msg; try{ msg=JSON.parse(buf.toString()); }catch(e){ return; }
      if(topic===T+"/c/"+myCid&&msg.t==="pong"){ skewPong(msg.c,msg.h); return; }
      if(topic===T+"/e"&&msg.t==="sale"){ playSale(msg.sale,CS); return; }
      if(topic===T+"/s"&&msg.t==="state"){
        const hadState=!!CS; CS=msg.state;
        if(!hadState){ clearTimeout(roomWait); NET.joinAt=Date.now(); pub(T+"/h",{t:"join",name:NET.myName,cid:myCid});
          localStorage.setItem(LS_CLIENT,JSON.stringify({code:NET.code,name:NET.myName})); }
        else if(!NET.myId&&!NET.spectator&&Date.now()-(NET.joinAt||0)>3000){ // host was away when we joined: ask again
          NET.joinAt=Date.now(); pub(T+"/h",{t:"join",name:NET.myName,cid:myCid}); }
        render(); return;
      }
      if(topic===T+"/c/"+myCid){
        if(msg.t==="you"){ NET.myId=msg.id; NET.spectator=false; }
        if(msg.t==="spectator"){ NET.spectator=true; toast("Auction already started: you're spectating"); }
        if(msg.t==="err"){ NET.status=msg.msg; }
        if(msg.t==="bidErr"){ UI.bidErr=msg.msg; }
        if(msg.t==="toast"){ toast(msg.msg); }
        render(); return;
      }
      if(topic===T+"/toast"){ toast(msg.msg); }
    });
    clearTimeout(roomWait);
    roomWait=setTimeout(()=>{ if(!CS){ NET.status="Room not found: double-check the code with your host."; render(); } },7000);
  });
}
function hostToast(msg){ // toast locally + push to clients
  toast(msg);
  if(NET.mode==="host") pub(topicRoot(NET.code)+"/toast",{t:"toast",msg});
}

/* ================= GAME ACTIONS (host/local only) ================= */
function buildQueue(){
  if(S.window){ S.queue=[...S.window.order]; S.qIndex=0; return; }
  const set=S.settings;
  let pool=S.players.map(p=>p.id);
  const price=(pid)=>byId(S,pid).basePrice;
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const order=a=> set.order==="price" ? a.sort((x,y)=>price(y)-price(x)) : shuffle(a);
  if(set.marqueeFirst){
    const mq=order(pool.filter(pid=>price(pid)>=14));
    const rest=order(pool.filter(pid=>price(pid)<14));
    pool=[...mq,...rest];
  } else pool=order(pool);
  S.queue=pool; S.qIndex=0;
}
function startAuction(){
  if(S.managers.length<2){ UI.lastError="Need at least 2 managers."; render(); return; }
  // sanity: budget must cover squad at min prices
  const minTotal=S.settings.squadSize*Math.min(...S.players.map(p=>p.basePrice));
  if(S.settings.budget<minTotal){ UI.lastError="Budget too small: "+S.settings.squadSize+" slots need at least "+money(minTotal)+"."; render(); return; }
  UI.lastError="";
  buildQueue(); S.phase="auction"; startCurrent();
  hostToast("Auction started! "+S.queue.length+" players in the queue.");
  sync();
}
function startCurrent(){
  // find next player still needed & at least one manager with space
  while(S.qIndex<S.queue.length){
    const pid=S.queue[S.qIndex];
    if(!S.sold.some(x=>x.playerId===pid) && byId(S,pid)){ break; }
    S.qIndex++;
  }
  if(S.qIndex>=S.queue.length){ S.current=null; return; }
  const p=byId(S,S.queue[S.qIndex]);
  // The clock always runs now: it is the hammer.
  S.paused=false;
  S.current={playerId:p.id, bid:p.basePrice, bidderId:null, deadline:Date.now()+S.settings.timerSecs*1000};
}
function everyoneFull(){ return S.managers.every(m=>m.squad.length>=S.settings.squadSize); }
// amount: typed dollars, or undefined for the minimum raise. seenRef: the bid the bidder was looking at.
function placeBid(mid,amount,seenRef){
  if(!S||S.phase!=="auction"||!S.current)return;
  const m=S.managers.find(x=>x.id===mid); if(!m)return;
  const remote=NET.mode==="host"&&m.id!==NET.myId;
  const price=amount==null?nextBid(S):q25(Number(amount));
  const err=bidError(S,m,price,seenRef==null?null:String(seenRef));
  if(err){ if(remote)sendToManager(m,{t:"bidErr",msg:err}); else { UI.bidErr=err; render(); } return; }
  if(remote)sendToManager(m,{t:"bidErr",msg:""}); else UI.bidErr="";
  S.current.bid=price; S.current.bidderId=mid;
  S.current.deadline=Date.now()+S.settings.timerSecs*1000; // every bid resets the clock
  sync();
}
function togglePause(){
  const cur=S&&S.current; if(!cur)return;
  if(S.paused){
    S.paused=false; cur.deadline=Date.now()+(cur.pausedLeft||S.settings.timerSecs*1000); delete cur.pausedLeft;
    hostToast("Play resumes");
  } else {
    S.paused=true; cur.pausedLeft=Math.max(1500,(cur.deadline||Date.now())-Date.now()); cur.deadline=null;
    hostToast("The host has paused play");
  }
  sync();
}
// Every sale or pass gets a number. Each screen plays the gavel when it sees a new number in the synced state.
function recordSale(kind,p,m,price){
  S.saleSeq=(S.saleSeq||0)+1;
  // at: a strike time a moment ahead, on the host's clock, so every screen (host included) hits together.
  S.lastSale={seq:S.saleSeq,kind,playerId:p.id,managerId:m?m.id:null,price:price||0,at:Date.now()+(NET.mode==="host"?1000:0),
    line:p.name+" to "+(m?m.name:"")+" for "+money(price||0),name:p.name};
  // A tiny event on its own topic reaches clients well before the full state does.
  if(NET.mode==="host") pub(topicRoot(NET.code)+"/e",{t:"sale",sale:S.lastSale});
}
function sellCurrent(){
  const cur=S.current; if(!cur)return;
  if(cur.bidderId==null){ passCurrent(); return; }
  const m=S.managers.find(x=>x.id===cur.bidderId);
  const p=byId(S,cur.playerId);
  m.squad.push(p.id); m.spent=Math.round((m.spent+cur.bid)*100)/100;
  S.sold.push({playerId:p.id, managerId:m.id, price:cur.bid, round:S.round});
  S.unsold=S.unsold.filter(x=>x!==p.id);
  recordSale("sold",p,m,cur.bid);
  S.qIndex++;
  if(everyoneFull()){ finishAuction(); return; }
  startCurrent(); sync();
}
function passCurrent(){
  const cur=S.current; if(!cur)return;
  const p=byId(S,cur.playerId);
  if(!S.unsold.includes(p.id))S.unsold.push(p.id);
  recordSale("unsold",p,null,0);
  S.qIndex++; startCurrent(); sync();
}
function undoLast(){
  const last=S.sold.pop(); if(!last)return;
  const m=S.managers.find(x=>x.id===last.managerId);
  m.squad=m.squad.filter(x=>x!==last.playerId);
  m.spent=Math.round((m.spent-last.price)*100)/100;
  if(S.phase==="results")S.phase="auction";
  S.queue.splice(S.qIndex,0,last.playerId);
  hostToast("Undo: "+byId(S,last.playerId).name+" returned to auction");
  startCurrent(); sync();
}
function reauctionUnsold(){
  if(!S.unsold.length)return;
  S.queue=[...S.unsold]; S.unsold=[]; S.qIndex=0; S.round++;
  hostToast("Re-auction round "+S.round+": "+S.queue.length+" players back in!");
  startCurrent(); sync();
}
function finishAuction(){
  if(S.current&&!S.sold.some(x=>x.playerId===S.current.playerId)&&!S.unsold.includes(S.current.playerId))
    S.unsold.push(S.current.playerId);
  // everything still queued and never auctioned also counts as unsold
  for(let i=S.qIndex;i<S.queue.length;i++){
    const pid=S.queue[i];
    if(!S.sold.some(x=>x.playerId===pid)&&!S.unsold.includes(pid))S.unsold.push(pid);
  }
  S.phase="results"; S.current=null; hostToast("Auction complete!"); sync();
}
function restartAll(){
  if(!confirm("Restart and wipe this auction?"))return;
  if(NET.mode==="host"&&NET.client){ try{ NET.client.publish(topicRoot(NET.code)+"/s","",{retain:true}); }catch(e){} }
  localStorage.removeItem(LS_STATE); localStorage.removeItem(LS_NET);
  setTimeout(()=>location.reload(),150);
}

/* timer loop (host/local resolves; everyone re-renders countdown) */
setInterval(()=>{
  const state=st();
  if(!state||state.phase!=="auction"||!state.current)return;
  if((NET.mode==="host"||NET.mode==="local") && !state.paused && state.current.deadline && Date.now()>state.current.deadline){
    state.current.bidderId!=null ? sellCurrent() : passCurrent();
    return;
  }
  paintClock();
},100);
function paintClock(){
  const state=st(); if(!state||!state.current)return;
  const el=document.getElementById("timerbar"), tl=document.getElementById("timerleft"), go=document.getElementById("going");
  if(!el)return;
  const total=state.settings.timerSecs*1000;
  const left=state.paused?(state.current.pausedLeft||total):Math.max(0,(state.current.deadline||0)-nowAdj());
  el.style.width=Math.min(100,left/total*100)+"%";
  if(tl)tl.textContent=Math.ceil(left/1000)+"s";
  if(go){
    const word=state.paused?"Paused":left<=1000?"Going twice":left<=3000?"Going once":"";
    if(go.textContent!==word)go.textContent=word;
  }
}

/* ================= TOASTS AND THE SOLD STAMP ================= */
const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function toast(msg){
  const box=document.getElementById("toasts");
  const el=document.createElement("div"); el.className="toast"; el.textContent=msg;
  box.appendChild(el);
  setTimeout(()=>el.remove(),3200);
}
/* Sale events. The first state a screen sees only sets the baseline, so joining mid-auction
   or reloading never replays an old hammer. */
let seenSale=null;
function checkSale(state){
  if(!state)return;
  const ls=state.lastSale, seq=ls?ls.seq:0;
  if(seenSale===null||seq<seenSale){ seenSale=seq; return; }
  playSale(ls,state);
}
function playSale(ls,state){
  if(!ls||seenSale===null||ls.seq<=seenSale)return;
  seenSale=ls.seq;
  const wait=ls.at?ls.at-nowAdj():0;
  if(wait<-4000)return; // arrived far too late to be worth a hammer
  let line=ls.line, name=ls.name;
  if(!line&&state){ const p=byId(state,ls.playerId), m=state.managers.find(x=>x.id===ls.managerId);
    name=p?p.name:"?"; line=name+" to "+(m?m.name:"?")+" for "+money(ls.price); }
  setTimeout(()=>{ if(ls.kind==="sold") GAVEL.strike(line); else toast(name+" is passed in, unsold"); },Math.max(0,Math.min(wait,1500)));
}

const clubStyle = team => { const t=TEAMS[team]||{c:"#777",ink:"#fff"}; return "--club:"+t.c+";--club-ink:"+t.ink; };
const swatch = team => `<i class="sw" style="${clubStyle(team)}"></i>`;

function render(){

  } else if(NET.mode==="client"){
    html = !CS ? viewClientConnecting() :
      CS.phase==="lobby" ? viewLobby(CS,false) :
      CS.phase==="auction" ? viewAuction(CS,false) : viewResults(CS,false);
  } else if(S){
    html = S.phase==="lobby" ? viewLobby(S,true) :
      S.phase==="auction" ? viewAuction(S,true) : viewResults(S,true);
  } else {
    html = screen==="join"?viewJoin() : screen==="setup"?viewSetup() : viewHome();
  }
  if(UI.pool && state && screen!=="league") html+=viewPool(state);
  // Keep half-typed inputs (and focus) across re-renders. data-keep ties a value to its context,
  // so a typed bid is dropped when the next player comes up.
  const keep={}; document.querySelectorAll("[data-keep]").forEach(e=>{ keep[e.id]=[e.dataset.keep,e.value]; });
  const act=document.activeElement, actId=act&&act.id&&act!==document.body?act.id:null;  // keep keyboard focus in place
  app.innerHTML=html;
  for(const id in keep){ const e=document.getElementById(id); if(e&&e.dataset.keep===keep[id][0]) e.value=keep[id][1]; }
  if(actId){ const e=document.getElementById(actId); if(e&&e!==document.activeElement){ e.focus({preventScroll:true}); if(keep[actId]) try{ e.setSelectionRange(e.value.length,e.value.length); }catch(x){} } }
  if(!state && screen==="home") BALL.mount();
  if(!state && screen==="setup" && setupMode==="local") render_localnames(document.getElementById("nmgrs").value);
  if(state && state.phase==="auction") GAVEL.preload();
  checkSale(state);
  maybeAutoSave(state);
  paintClock();
  tickUrgency();
}

function header(state,extra){
  const code=NET.code?`<button class="codechip" onclick="copyLink()" title="Copy the invite link">ROOM ${esc(NET.code)}</button>`:"";
  const net=NET.mode&&NET.mode!=="local"?(NET.status==="live"?`<span class="dot" title="Connected"></span>`:`<span class="dot off"></span><span class="small muted">${esc(NET.status)}</span>`):"";
  return `<header class="topbar">
    <div class="row"><span class="wordmark">Bid<b>Bash</b></span>${code}${net}</div>
    <div class="row">${extra||""}</div>
  </header>`;
}
function copyLink(){
  const link=location.origin.startsWith("http")?location.href.split("#")[0]+"#"+NET.code:NET.code;
  if(navigator.clipboard) navigator.clipboard.writeText(link).then(()=>toast("Invite copied: "+link)).catch(()=>toast("Room code: "+NET.code));

}

function viewJoin(){

function viewClientConnecting(){

let setupMode="local";

function viewSetup(){

function render_localnames(n){
  n=Math.max(2,Math.min(10,parseInt(n)||4));

  let html="";
  for(let i=0;i<n;i++){

    html+=`<input id="mn${i}" maxlength="20" aria-label="Manager ${i+1} name" placeholder="Manager ${i+1}" value="${prev?esc(prev.value):""}">`;
  }
  box.innerHTML=html;
}
function createGame(){
  UI.lastError="";
  if(setupMode==="host"){
    const name=(document.getElementById("hostname").value||"").trim();
    if(!name){ UI.lastError="Add your name first."; render(); return; }
    NET.myName=name; NET.myId=1;
    S=newState([makeManager(1,name)],defaultSettings());
    hostRoom(genCode());
    sync();
  } else {
    NET.mode="local";
    const n=Math.max(2,Math.min(10,parseInt(document.getElementById("nmgrs").value)||4));
    const managers=[];
    for(let i=0;i<n;i++){
      const el=document.getElementById("mn"+i);
      const v=((el&&el.value)||"").trim()||("Manager "+(i+1));
      managers.push(makeManager(i+1,v));
    }
    S=newState(managers,defaultSettings());
    sync();
  }
}
function resumeSaved(){
  try{
    const saved=JSON.parse(localStorage.getItem(LS_STATE));
    S=saved.state; S.managers.forEach(m=>{m.connected=false;});
    NET.myName=saved.net.myName||""; NET.myId=1;
    if(saved.net.mode==="host"&&peerAvailable()){ hostRoom(saved.net.code||genCode()); }
    else NET.mode="local";
    if(NET.mode==="host")S.managers.forEach(m=>{if(m.name===NET.myName)m.connected=true;});
    sync(); toast("Auction restored");
  }catch(e){ toast("That save would not load"); localStorage.removeItem(LS_STATE); }
}

function numSet(key,label,val,min,max,step){
  return `<label class="field"><span>${label}</span>

function setRule(k,v){ S.settings[k]=v; sync(); }
function addLocalManager(){

}
function removeManager(id){ S.managers=S.managers.filter(m=>m.id!==id); sync(); }

/* ---------- auction ---------- */
function viewAuction(state,canControl){
  const set=state.settings;
  if(!state.current) return viewRoundEnd(state,canControl);
  const p=byId(state,state.current.playerId);
  const cur=state.current;
  const leader=cur.bidderId!=null?state.managers.find(m=>m.id===cur.bidderId):null;
  const next=nextBid(state);
  const left=state.queue.length-state.qIndex-1;
  const isMarquee=p.basePrice>=14&&set.marqueeFirst&&state.round===1;
  const bidKey=cur.playerId+":"+cur.bid+":"+cur.bidderId;
  const bump=lastBidShown!==null&&lastBidShown!==bidKey&&cur.bidderId!=null;
  lastBidShown=bidKey;

  const paused=!!state.paused;
  let bidControls="";
  if(NET.mode==="local"){
    if(!state.managers.some(m=>m.id===UI.localBidder)) UI.localBidder=state.managers[0].id;
    const sel=state.managers.find(m=>m.id===UI.localBidder);
    bidControls=`<div class="bidgrid">`+state.managers.map(m=>{
      const leading=cur.bidderId===m.id;
      const block=leading?null:bidBlockReason(state,m,p,next);
      return `<button class="btn ${leading?"":"btn-primary"} bid ${leading?"leading":""}" ${leading||block||paused?"disabled":""} onclick="placeBid(${m.id})">
        <span class="who">${esc(m.name)}</span>
        <span>${leading?"Leading":"Bid "+money(next)}</span>
        <small>${block?esc(block):money(set.budget-m.spent)+" left, "+m.squad.length+" of "+set.squadSize}</small>
      </button>`;}).join("")+`</div>
      <form class="typebid" onsubmit="submitTyped(event)">
        <label class="field"><span>Who</span>
          <select id="localwho" onchange="UI.localBidder=parseInt(this.value);UI.bidErr='';render()">
            ${state.managers.map(m=>`<option value="${m.id}" ${m.id===sel.id?"selected":""}>${esc(m.name)}</option>`).join("")}
          </select></label>
        ${typedField(state,sel,p,next,paused)}
      </form>
      ${bidHelp(state,sel,p)}`;
  } else {
    const me=state.managers.find(m=>m.id===NET.myId);
    if(NET.spectator||!me){
      bidControls=`<p class="muted" style="text-align:center">You are watching from the hill. No paddle this time.</p>`;
    } else {
      const leading=cur.bidderId===me.id;
      const block=leading?null:bidBlockReason(state,me,p,next);
      const mx=maxBid(state,me,p);
      const quick=[...new Set([next,q25(cur.bid+1),q25(cur.bid+2)])].filter(a=>a>next&&a<=mx.max).slice(0,2);
      bidControls=`<div class="bidrow">
        <button class="btn ${leading?"":"btn-primary"} bid bid-solo ${leading?"leading":""}" ${leading||block||paused?"disabled":""}
          onclick="sendBid(${next})">
          <span>${leading?"You lead":"Bid "+money(next)}</span>
          <small>${block?esc(block):money(set.budget-me.spent)+" left in your purse"}</small>
        </button>
        ${quick.length&&!leading&&!paused?`<div class="quick">${quick.map(a=>`<button class="btn" onclick="sendBid(${a})">${money(a)}</button>`).join("")}</div>`:""}
      </div>
      <form class="typebid" onsubmit="submitTyped(event)">${typedField(state,me,p,next,paused||leading)}</form>
      ${bidHelp(state,me,p)}`;
    }
  }
  const hostControls=canControl?`
    <div class="hostbar">
      <button class="btn btn-sm" onclick="togglePause()">${paused?"Resume":"Pause"}</button>
      <button class="btn btn-sm" ${state.sold.length?"":"disabled"} onclick="undoLast()">Undo last sale</button>
      <button class="btn btn-sm btn-quiet" onclick="if(confirm('End the auction now? Everyone left goes unsold.'))finishAuction()">End the auction</button>
    </div>`:"";

  return `${header(state,`
      <span class="label">${left} to come, round ${state.round}</span>
      <button class="btn btn-sm" onclick="UI.pool=true;render()">Player pool</button>`)}
  <main>
  <section class="lot" id="lot" style="${clubStyle(p.team)}" aria-live="polite">
    <div class="lot-band">
      <span>${esc(p.team)}</span>
      <span>${ROLE_LABEL[p.role]||p.role}</span>
      ${p.overseas?`<span>Overseas</span>`:""}
      ${isMarquee?`<span>Marquee</span>`:""}
      <span class="grow"></span><span>Base ${money(p.basePrice)}</span>
    </div>
    <div class="lot-body">
      <div>
        <div class="lot-name">${esc(p.name)}</div>
        ${p.note||p.unverified?`<p class="lot-note">${p.unverified?`<b>Unverified.</b> `:""}${esc(p.note||"Check this one before you bid big.")}</p>`:""}
      </div>
      <div class="score">
        <div class="label">${leader?"Current bid":"Opens at"}</div>
        <div class="amt ${bump?"bump":""}">${money(cur.bid)}</div>
        <div class="leader ${leader?"":"none"}">${leader?esc(leader.name):"No bids yet"}</div>
      </div>
    </div>
    <div class="clock"><span class="secs" id="timerleft"></span><div class="track"><div class="bar" id="timerbar" style="width:100%"></div></div><span class="going" id="going" aria-live="assertive"></span></div>
    <div class="lot-actions">${bidControls}${hostControls}</div>
  </section>
  <h3 class="mt">The table</h3>
  <div class="board mt-s">${state.managers.map(m=>mgrCard(state,m,cur.bidderId===m.id)).join("")}</div>
  </main>`;
}
function typedField(state,m,p,next,off){
  return `<label class="field grow"><span>Your bid</span>
      <span class="money-in"><b aria-hidden="true">$</b><input id="bidamt" data-keep="${state.current.playerId}" type="text" inputmode="decimal" enterkeyhint="go"
        autocomplete="off" placeholder="${fmt(next)}" aria-describedby="bidhelp" ${off?"disabled":""}></span></label>
      <button class="btn btn-primary" type="submit" ${off?"disabled":""}>Bid</button>`;
}
function bidHelp(state,m,p){
  const mx=maxBid(state,m,p);
  return `<p class="bidhelp" id="bidhelp">${mx.max>0?`${esc(m.name)} can bid up to <b>${money(mx.max)}</b>. Steps of ${money(state.settings.increment)}, any amount in 0.25s.`:`${esc(m.name)} can't bid on this one: ${esc(mx.reason)}.`}</p>
    ${UI.bidErr?`<p class="biderr" role="alert">${esc(UI.bidErr)}</p>`:""}`;
}
function submitTyped(ev){
  ev.preventDefault();
  const el=document.getElementById("bidamt"); if(!el)return;
  const raw=el.value.replace(/[$,\s]/g,"");
  if(!raw){ UI.bidErr="Type an amount first."; render(); return; }
  sendBid(parseFloat(raw), NET.mode==="local"?UI.localBidder:NET.myId);
}
// One path for every bid: check locally for an instant answer, then the host checks again.
function sendBid(amount,mid){
  const state=st(); if(!state||!state.current)return;
  if(mid==null)mid=NET.myId;
  const m=state.managers.find(x=>x.id===mid); if(!m)return;
  const a=q25(amount), ref=bidRef(state);
  const err=bidError(state,m,a,null);
  if(err){ UI.bidErr=err; render(); return; }
  UI.bidErr="";
  const el=document.getElementById("bidamt"); if(el)el.value="";
  if(NET.mode==="client") pub(topicRoot(NET.code)+"/h",{t:"bid",cid:myCid,amount:a,ref});
  else placeBid(mid,a,ref);
  render();
}
function clientBid(){ sendBid(nextBid(CS)); }
function mgrCard(state,m,winning){
  const set=state.settings;
  const c=roleCounts(state,m);
  const online=NET.mode!=="local";
  const chips=m.squad.map(pid=>{const p=byId(state,pid);
    return `<span class="chip">${swatch(p.team)}${esc(p.name)}</span>`;}).join("");
  return `<div class="mgr ${winning?"lead":""}">
    <div class="mgr-head">
      <span class="mgr-name">${esc(m.name)} ${online&&m.id===NET.myId?`<span class="tagline you">You</span>`:""}</span>
      <span class="mgr-left" title="Purse left">${money(set.budget-m.spent)}</span>
    </div>
    <div class="tagline muted">${winning?"Leading this lot":online&&!m.connected?"Away from the table":"Purse left"}</div>
    <div class="mgr-stats">
      <span><b>${m.squad.length}/${set.squadSize}</b>Squad</span>
      <span><b>${osCount(state,m)}/${set.maxOverseas}</b>Overseas</span>
      <span><b>${money(m.spent)}</b>Spent</span>
      <span><b>${c.BAT}/${set.minBAT}</b>Bat</span>
      <span><b>${c.BOWL}/${set.minBOWL}</b>Bowl</span>
      <span><b>${c.AR}/${set.minAR} ${c.WK}/${set.minWK}</b>AR and WK</span>
    </div>
    ${chips?`<div class="chips">${chips}</div>`:""}
  </div>`;
}
function viewRoundEnd(state,canControl){
  const unsoldList=state.unsold.map(pid=>{const p=byId(state,pid);
    return `<span class="chip">${swatch(p.team)}${esc(p.name)}, ${money(p.basePrice)}</span>`;}).join("");
  return `${header(state,`<button class="btn btn-sm" onclick="UI.pool=true;render()">Player pool</button>`)}
  <main>
  <section class="panel stack">
    <h2>Stumps on round ${state.round}</h2>
    <p class="muted">${state.sold.length} sold, ${state.unsold.length} passed in.</p>
    ${state.unsold.length?`<div class="chips">${unsoldList}</div>`:""}
    ${canControl?`<div class="row">
      ${state.unsold.length?`<button class="btn btn-lg" onclick="reauctionUnsold()">Re-auction the ${state.unsold.length} unsold</button>`:""}

async function sbErr(r){ try{ const j=await r.json(); return j.message||j.hint||("The server said "+r.status); }catch(e){ return "The server said "+r.status; } }
async function sbGet(path){

async function sbRpc(fn,body){

/* ---------- the maths: rounds, lineups, emergencies, totals ---------- */
const lgP=(D,pid)=>D.byId[pid]||{id:pid,name:"Player "+pid,team:"",role:"BAT",basePrice:0};
function openRoundOf(D){
  const first={}; D.fixtures.forEach(f=>{ const t=Date.parse(f.starts_at); first[f.round]=Math.min(first[f.round]==null?Infinity:first[f.round],t); });
  const fut=Object.keys(first).filter(r=>first[r]>Date.now()).map(Number);
  if(fut.length) return Math.min(...fut);
  const rs=Object.keys(first).map(Number); return rs.length?Math.max(...rs)+1:1;
}
function lockTime(D,r){ const t=D.fixtures.filter(f=>f.round===r).map(f=>Date.parse(f.starts_at)); return t.length?Math.min(...t):null; }
function startedRounds(D){ return [...new Set(D.fixtures.filter(f=>Date.parse(f.starts_at)<=Date.now()).map(f=>f.round))].sort((a,b)=>a-b); }
function squadNow(D,mid){ return D.ownership.filter(o=>o.manager_id===mid&&!o.released&&o.to_round==null).map(o=>o.player_id); }
function ownedIn(D,mid,r){ return D.ownership.filter(o=>o.manager_id===mid&&o.from_round!=null&&o.from_round<=r&&(o.to_round==null||r<o.to_round)).map(o=>o.player_id); }
function pricePaid(D,mid,pid){ const o=D.ownership.filter(x=>x.manager_id===mid&&x.player_id===pid).pop(); return o?+o.price:0; }
// Default XI when a manager never set one: dearest legal shape, rest on the bench by price.
function autoLineup(D,ids){
  const by=[...ids].sort((a,b)=>(lgP(D,b).basePrice||0)-(lgP(D,a).basePrice||0));
  const xi=[];
  for(const role in XI_SHAPE){ by.filter(p=>lgP(D,p).role===role&&!xi.includes(p)).slice(0,XI_SHAPE[role]).forEach(p=>xi.push(p)); }
  by.forEach(p=>{ if(xi.length<11&&!xi.includes(p))xi.push(p); });
  return {xi,bench:by.filter(p=>!xi.includes(p)),auto:true};
}
function lineupFor(D,mid,r){
  const l=D.lineups.filter(x=>x.manager_id===mid&&x.from_round<=r).sort((a,b)=>b.from_round-a.from_round)[0];
  return l?{xi:l.xi,bench:l.bench,from:l.from_round}:autoLineup(D,r>=1?ownedIn(D,mid,r):squadNow(D,mid));
}
function fixtureScore(D,fid,pid){
  const o=D.overrides[fid+":"+pid]; if(o) return {points:+o.points,played:true,src:"commissioner",breakdown:[["Set by the commissioner"+(o.note?": "+o.note:""),+o.points]]};
  const p=D.points[fid+":"+pid]; return p?{points:+p.points,played:p.played,src:p.source,breakdown:p.breakdown}:null;
}
function playerRound(D,pid,r){
  const club=lgP(D,pid).team;
  const fx=D.fixtures.filter(f=>f.round===r&&(f.home===club||f.away===club));
  let points=0, played=false, live=false;
  fx.forEach(f=>{ const s=fixtureScore(D,f.id,pid); if(s&&s.played){ played=true; points+=s.points; if(s.src==="live")live=true; } });
  return {points,played,live,done:fx.every(f=>f.ended||f.final),games:fx.length};
}
function teamRound(D,mid,r){
  const owned=new Set(ownedIn(D,mid,r));
  const lu=lineupFor(D,mid,r);
  const bench=lu.bench.filter(p=>owned.has(p)), used=new Set(), lines=[];
  let total=0;
  for(const pid of lu.xi){
    const rp=owned.has(pid)?playerRound(D,pid,r):{points:0,played:false,done:true};
    if(rp.played){ total+=rp.points; lines.push({pid,points:rp.points,kind:"starter"}); continue; }
    if(!rp.done){ lines.push({pid,points:0,kind:"waiting"}); continue; }
    const e=bench.find(b=>!used.has(b)&&playerRound(D,b,r).played);   // emergencies come in, in bench order
    if(e){ used.add(e); const p=playerRound(D,e,r).points; total+=p; lines.push({pid:e,points:p,kind:"emergency",for:pid}); }
    else lines.push({pid,points:0,kind:"out"});
  }
  return {total,lines,lineup:lu};
}
function seasonTable(D){
  const rounds=startedRounds(D), cur=rounds[rounds.length-1];
  return D.managers.map(m=>{
    const per=rounds.map(r=>teamRound(D,m.id,r).total);
    return {m,season:per.reduce((a,b)=>a+b,0),round:cur!=null?per[per.length-1]:0,per};
  }).sort((a,b)=>b.season-a.season||b.round-a.round);
}

/* My Team: the field */
const GROUPS=[["WK","Wicketkeepers",1],["BAT","Batters",3],["BOWL","Bowlers",3],["FLEX","All-rounders / Flex",4]];
function groupOf(D,xi){
  // Each role fills its minimum first; anyone past the minimum, and every all-rounder, sits in Flex.
  const g={WK:[],BAT:[],BOWL:[],FLEX:[]};
  xi.forEach(pid=>{ const r=lgP(D,pid).role; if(r!=="AR"&&g[r].length<XI_SHAPE[r]) g[r].push(pid); else g.FLEX.push(pid); });
  g.FLEX.sort((a,b)=>(lgP(D,a).role==="AR"?0:1)-(lgP(D,b).role==="AR"?0:1));
  return g;
}
function lgTeam(D){
  const m=me();
  const mid=LG.view!=null?LG.view:(m?m.mid:null);
  if(mid==null) return signInPanel(D);
  const mgr=D.managers.find(x=>x.id===mid); if(!mgr) return `<p class="muted">No such manager.</p>`;
  const mine=m&&m.mid===mid;
  const R=openRoundOf(D), rounds=startedRounds(D), cur=rounds[rounds.length-1];
  const winOpen=D.windows.some(w=>w.status==="open");
  const saved=lineupFor(D,mid,R);
  const squad=squadNow(D,mid);
  if(mine&&(!LG.draft||LG.draft.mid!==mid)){
    const keep=x=>squad.includes(x);
    const xi=saved.xi.filter(keep), bench=saved.bench.filter(keep);
    squad.forEach(p=>{ if(!xi.includes(p)&&!bench.includes(p)) bench.push(p); });
    LG.draft={mid,xi,bench,dirty:false};
  }
  const L=mine?LG.draft:{xi:saved.xi.filter(p=>squad.includes(p)),bench:saved.bench.filter(p=>squad.includes(p))};
  const g=groupOf(D,L.xi);
  const roles={WK:0,BAT:0,BOWL:0,AR:0}; L.xi.forEach(p=>roles[lgP(D,p).role]++);
  const lock=lockTime(D,R);
  const editable=mine&&!winOpen;
  const card=(pid,where,idx)=>{
    const p=lgP(D,pid), rp=cur!=null?playerRound(D,pid,cur):{points:0};
    const sel=LG.sel&&LG.sel.pid===pid;
    return `<button id="pc-${pid}" class="pcard ${sel?"sel":""}" style="${clubStyle(p.team)}" ${editable?`onclick="tapCard(${pid},'${where}')"`:`onclick="showPlayer(${pid})"`}
      aria-pressed="${sel?"true":"false"}" aria-label="${esc(p.name)}, ${ROLE_LABEL[p.role]}, ${where==="bench"?"emergency "+(idx+1):"starting"}">
      ${where==="bench"?`<span class="eorder">E${idx+1}</span>`:""}
      <span class="pname">${esc(p.name)}</span>
      <span class="pmeta">${esc((TEAMS[p.team]||{}).ab||p.team)} &middot; ${p.role} &middot; ${money(pricePaid(D,mid,pid))}</span>
      <span class="ppts"><span><b>${pts1(rp.points)}</b> rnd</span><span><b>${pts1(playerSeason(D,pid))}</b> season</span></span>
    </button>`;
  };
  const have={WK:0,BAT:0,BOWL:0,AR:0}; squad.forEach(p=>have[lgP(D,p).role]++);
  const size=Math.min(11,squad.length);   // a short squad fields everyone it has
  const need=k=>k==="FLEX"?size-Math.min(1,have.WK)-Math.min(3,have.BAT)-Math.min(3,have.BOWL):Math.min(XI_SHAPE[k],have[k]);
  const shapeOk=L.xi.length===size&&["WK","BAT","BOWL","AR"].every(r=>roles[r]>=Math.min(XI_SHAPE[r],have[r]));
  const sel=LG.sel;
  const bar=editable&&sel?`<div class="actionbar" role="toolbar" aria-label="Move ${esc(lgP(D,sel.pid).name)}">
      <span class="small"><b>${esc(lgP(D,sel.pid).name)}</b> selected. Tap a player on the ${sel.where==="xi"?"bench":"field"} to swap.</span>
      ${sel.where==="xi"?`<button class="btn btn-sm" onclick="moveSel('bench')">To the bench</button>`
        :`<button class="btn btn-sm" ${L.xi.length>=Math.min(11,squad.length)?"disabled":""} onclick="moveSel('xi')">To the field</button>
          <button class="btn btn-sm" onclick="moveSel('up')" aria-label="Move up the emergency order">Up</button>
          <button class="btn btn-sm" onclick="moveSel('down')" aria-label="Move down the emergency order">Down</button>`}
      <button class="btn btn-sm btn-quiet" onclick="showPlayer(${sel.pid})">Points</button>
      <button class="btn btn-sm btn-quiet" onclick="LG.sel=null;render()">Done</button></div>`:"";
  const tr=cur!=null?teamRound(D,mid,cur):null;
  return `<section class="stack">
    <div class="row between">
      <h2>${mine?"My team":esc(mgr.name)}</h2>
      <div class="row">${D.managers.length>1?`<select aria-label="View another team" onchange="LG.view=parseInt(this.value);LG.sel=null;render()">
        ${D.managers.map(x=>`<option value="${x.id}" ${x.id===mid?"selected":""}>${esc(x.name)}${m&&m.mid===x.id?" (you)":""}</option>`).join("")}</select>`:""}</div>
    </div>
    <p class="small muted">${winOpen?"The trade window is open, so lineups are locked until it closes."
      : lock?`This lineup counts from round ${R}. It locks at the first ball, ${sydTime(lock)} Sydney time.`:`This lineup counts from round ${R}.`}
      ${saved.auto&&!LG.draft?.dirty?" No XI saved yet, so the dearest legal XI plays.":""}
      ${tr?` Round ${cur} so far: <b>${pts1(tr.total)}</b> points.`:""}</p>
    <div class="teamgrid">
      <div class="pitchwrap"><div class="pitch" aria-label="Starting XI">
        ${GROUPS.map(([k,label])=>`<div class="pgroup">
          <div class="pillhead"><span>${label}</span><b>${g[k].length}/${need(k)}</b></div>
          <div class="pcards">${g[k].map(pid=>card(pid,"xi")).join("")||`<span class="empty">Empty</span>`}</div></div>`).join("")}
        <div class="pitchfoot"><span>Total selected <b>${L.xi.length}/${size}</b></span>
          ${shapeOk?"":`<span class="small">${L.xi.length!==size?"Pick "+size+" starters. ":""}Needs at least 1 keeper, 3 batters, 3 bowlers and 1 all-rounder${squad.length<13?", or all you have of a role":""}.</span>`}</div>
      </div></div>
      <aside class="bench" aria-label="Bench and emergencies">
        <div class="pillhead"><span>Bench</span><b>${L.bench.length}</b></div>
        <p class="small muted">Emergencies come in, in this order, for any starter who doesn't play that round.</p>
        <div class="pcards col">${L.bench.map((pid,i)=>card(pid,"bench",i)).join("")||`<span class="empty">Nobody on the bench</span>`}</div>
      </aside>
    </div>
    ${bar}
    ${editable?`<div class="row"><button class="btn btn-primary" ${shapeOk&&LG.draft.dirty?"":"disabled"} onclick="saveLineup()">Save lineup</button>
      ${LG.draft.dirty?`<button class="btn btn-quiet" onclick="LG.draft=null;LG.sel=null;render()">Undo changes</button>`:`<span class="small muted">Saved.</span>`}</div>`:""}
    ${tr?roundLines(D,tr,cur):""}
  </section>`;
}
function roundLines(D,tr,r){
  const label={starter:"Started",emergency:"Emergency",waiting:"Yet to play",out:"Didn't play"};
  return `<section class="panel"><h3>Round ${r} scoring</h3>
    <div class="scroll mt-s"><table><thead><tr><th>Player</th><th>Status</th><th class="num">Points</th></tr></thead><tbody>
    ${tr.lines.map(l=>`<tr><td><button class="linkbtn" onclick="showPlayer(${l.pid})">${esc(lgP(D,l.pid).name)}</button></td>
      <td class="muted">${label[l.kind]}${l.for?" for "+esc(lgP(D,l.for).name):""}</td><td class="num">${pts1(l.points)}</td></tr>`).join("")}
    <tr><td><b>Total</b></td><td></td><td class="num big">${pts1(tr.total)}</td></tr></tbody></table></div></section>`;
}
function tapCard(pid,where){
  const d=LG.draft, sel=LG.sel;
  if(sel&&sel.pid===pid){ LG.sel=null; return render(); }
  if(sel&&sel.where!==where){                       // swap a starter and a bench player
    const xiP=where==="xi"?pid:sel.pid, bP=where==="bench"?pid:sel.pid;
    d.xi[d.xi.indexOf(xiP)]=bP; d.bench[d.bench.indexOf(bP)]=xiP; d.dirty=true; LG.sel=null; return render();
  }
  LG.sel={pid,where}; render();
}
function moveSel(how){
  const d=LG.draft, s=LG.sel; if(!s)return;
  if(how==="bench"){ d.xi=d.xi.filter(x=>x!==s.pid); d.bench.push(s.pid); s.where="bench"; }
  else if(how==="xi"){ if(d.xi.length>=Math.min(11,d.xi.length+d.bench.length))return; d.bench=d.bench.filter(x=>x!==s.pid); d.xi.push(s.pid); s.where="xi"; }
  else { const i=d.bench.indexOf(s.pid), j=how==="up"?i-1:i+1; if(i<0||j<0||j>=d.bench.length)return; [d.bench[i],d.bench[j]]=[d.bench[j],d.bench[i]]; }
  d.dirty=true; render();
}
async function saveLineup(){
  const m=me(); if(!m)return;
  try{ const r=await sbRpc("set_lineup",{p_code:LG.code,p_mid:m.mid,p_pin:m.pin,p_xi:LG.draft.xi,p_bench:LG.draft.bench});
    LG.draft.dirty=false; LG.sel=null; await loadLeague(true); lgSay("Lineup saved for round "+r+" onwards."); }
  catch(e){ lgSay(e.message,true); }
}
function showPlayer(pid){
  const D=LG.data, p=lgP(D,pid);
  LG.modal=()=>{
    const rows=D.fixtures.filter(f=>f.home===p.team||f.away===p.team).filter(f=>fixtureScore(D,f.id,pid)).map(f=>{
      const s=fixtureScore(D,f.id,pid);
      return `<tr><td>R${f.round}</td><td>${esc(f.home===p.team?"v "+f.away:"at "+f.home)}<span class="small muted" style="display:block">${sydTime(f.starts_at)}${s.src==="live"?", provisional":""}</span></td>
        <td class="small">${(s.breakdown||[]).map(([l,v])=>esc(l)+" "+(v>0?"+":"")+v).join(", ")||"-"}</td><td class="num">${pts1(s.points)}</td></tr>`;}).join("");
    return `<div class="modal" onclick="if(event.target===this){LG.modal=null;render()}"><div class="panel" role="dialog" aria-label="${esc(p.name)} points">
      <div class="row between"><h2>${esc(p.name)}</h2><button class="btn btn-sm" onclick="LG.modal=null;render()">Close</button></div>
      <p class="muted mt-s">${swatch(p.team)} ${esc(p.team)}, ${ROLE_LABEL[p.role]}. Season: <b>${pts1(playerSeason(D,pid))}</b> points.</p>
      <div class="scroll mt-s"><table><thead><tr><th>Rnd</th><th>Match</th><th>How</th><th class="num">Pts</th></tr></thead>
      <tbody>${rows||`<tr><td colspan="4" class="muted">No points yet.</td></tr>`}</tbody></table></div></div></div>`;
  };
  render();
}

/* Squads */
function lgSquads(D){

    const ids=squadNow(D,m.id);

        <td class="muted">${esc(p.team)}</td><td>${p.role}${p.overseas?", overseas":""}</td><td class="price">${money(pricePaid(D,m.id,pid))}</td><td class="num">${pts1(playerSeason(D,pid))}</td></tr>`;}).join("")}
      </tbody></table></div></section>`;}).join("");
}

/* Points by match, plus the commissioner's manual fallback */
function lgMatches(D){
  if(!D.fixtures.length) return `<section class="panel"><h2>Points</h2><p class="muted mt-s">The fixture list loads once the points fetcher has run. BBL|16 starts 12 December.</p></section>`;
  const owned=new Set(D.ownership.filter(o=>!o.released&&o.to_round==null).map(o=>o.player_id));
  const byRound={}; D.fixtures.forEach(f=>(byRound[f.round]=byRound[f.round]||[]).push(f));
  return `<section class="panel"><div class="row between"><h2>Points by match</h2>
      <span class="small muted">${D.updated?"Updated "+sydTime(D.updated):"Not updated yet"}</span></div>
    <p class="small muted mt-s">Live points come from the scorecard and leave out dot balls until the ball-by-ball file lands, usually a day or two later. Then the match shows Final.</p></section>
    ${Object.keys(byRound).map(r=>`<section class="panel mt"><h3>Round ${r}</h3><div class="fixtures mt-s">
      ${byRound[r].map(f=>{ const started=Date.parse(f.starts_at)<=Date.now();
        const st=f.final?"Final":f.ended?"Finished, provisional":started?"Live":"Upcoming";
        const n=Object.keys(D.points).filter(k=>k.startsWith(f.id+":")&&owned.has(+k.split(":")[1])).length;
        return `<button class="fixture" onclick="showFixture('${esc(f.id)}')"><span class="ftitle">${esc(f.home)} v ${esc(f.away)}</span>
          <span class="small muted">${sydTime(f.starts_at)}</span><span class="tagline ${st==="Live"?"livetag":""}">${st}${n?", "+n+" owned players scored":""}</span></button>`;}).join("")}
    </div></section>`).join("")}`;
}
function showFixture(fid){
  const D=LG.data, f=D.fixtures.find(x=>x.id===fid); if(!f)return;
  const owners={}; D.ownership.filter(o=>!o.released&&o.to_round==null).forEach(o=>{ owners[o.player_id]=o.manager_id; });
  const pool=D.league.players.filter(p=>p.team===f.home||p.team===f.away);
  const c=cpin();
  LG.modal=()=>`<div class="modal" onclick="if(event.target===this){LG.modal=null;render()}"><div class="panel" role="dialog" aria-label="Match points">
    <div class="row between"><h2>${esc(f.home)} v ${esc(f.away)}</h2><button class="btn btn-sm" onclick="LG.modal=null;render()">Close</button></div>
    <p class="muted mt-s">${sydTime(f.starts_at)}. ${f.final?"Final points.":"Points may still change."} ${c?"You can type over any player's points; clear a box to go back to the feed.":""}</p>
    <div class="scroll mt-s"><table><thead><tr><th>Player</th><th>Owner</th><th>How</th><th class="num">Pts</th></tr></thead><tbody>
    ${pool.sort((a,b)=>((fixtureScore(D,fid,b.id)||{}).points||0)-((fixtureScore(D,fid,a.id)||{}).points||0)).map(p=>{
      const s=fixtureScore(D,fid,p.id); const o=D.managers.find(m=>m.id===owners[p.id]);
      return `<tr><td><span class="row" style="gap:var(--s2);flex-wrap:nowrap">${swatch(p.team)}${esc(p.name)}</span></td><td class="muted">${o?esc(o.name):"-"}</td>
        <td class="small">${s?(s.played?(s.breakdown||[]).map(([l,v])=>esc(l)+" "+(v>0?"+":"")+v).join(", "):"Didn't play"):"-"}</td>
        <td class="num">${c?`<input type="text" inputmode="decimal" aria-label="Points for ${esc(p.name)}" value="${D.overrides[fid+":"+p.id]?esc(D.overrides[fid+":"+p.id].points):""}" placeholder="${s?pts1(s.points):"0"}" onchange="setPoints('${esc(fid)}',${p.id},this.value)" style="width:72px">`:(s?pts1(s.points):"-")}</td></tr>`;}).join("")}
    </tbody></table></div>
    ${c?`<details class="mt-s"><summary class="small">Paste points for many players</summary>
      <p class="small muted mt-s">One per line: player name, points. For example: Mitch Marsh, 64</p>

      <button class="btn btn-sm mt-s" onclick="pastePoints('${esc(fid)}')">Apply</button></details>`:""}

async function setPoints(fid,pid,v){
  const val=String(v).trim()===""?null:parseFloat(v);
  if(val!==null&&!isFinite(val)) return lgSay("Points must be a number.",true);
  try{ await sbRpc("commish_set_points",{p_code:LG.code,p_pin:cpin(),p_fixture:fid,p_player:pid,p_points:val,p_note:null}); await loadLeague(true); }
  catch(e){ lgSay(e.message,true); }
}
async function pastePoints(fid){
  const D=LG.data, lines=(document.getElementById("pastepts").value||"").split(/\n/).map(s=>s.trim()).filter(Boolean);
  const bad=[]; let n=0;
  for(const line of lines){
    const m=/^(.+?)[,\t]\s*(-?\d+(?:\.\d+)?)$/.exec(line); if(!m){ bad.push(line); continue; }
    const full=m[1].toLowerCase().trim(), bare=full.replace(/\s*\(.*\)/,"").trim();
    let hits=D.league.players.filter(p=>p.name.toLowerCase()===full);       // exact first: "Tom Rogers (Stars)"
    if(!hits.length) hits=D.league.players.filter(p=>p.name.toLowerCase().replace(/\s*\(.*\)/,"").trim()===bare);
    if(hits.length!==1){ bad.push(line); continue; }
    try{ await sbRpc("commish_set_points",{p_code:LG.code,p_pin:cpin(),p_fixture:fid,p_player:hits[0].id,p_points:parseFloat(m[2]),p_note:"pasted"}); n++; }
    catch(e){ bad.push(line+" ("+e.message+")"); }
  }
  await loadLeague(true);
  lgSay("Set "+n+" player"+(n===1?"":"s")+"."+(bad.length?" Couldn't place (check the spelling, or add the club in brackets for two players with one name): "+bad.join("; "):""),bad.length>0);
}

/* Trade window */
function lgTrades(D){
  const m=me(), c=cpin(), rules=D.league.rules||{};
  const w=D.windows.find(x=>["vote","scheduled","open"].includes(x.status));
  const name=id=>esc((D.managers.find(x=>x.id===id)||{}).name||"?");
  let head="";
  if(!w){
    head=`<p class="muted">The market is shut. Any manager can call a vote to open it; it opens if more than ${rules.votePct??50}% of managers say yes within 24 hours.</p>
      <div class="row">${m?`<button class="btn btn-primary" onclick="lgAct('call_vote')">Call a vote</button>`:`<button class="btn" onclick="LG.tab='team';render()">Sign in to call a vote</button>`}</div>
      ${c?`<details class="mt-s"><summary>Schedule a window (commissioner)</summary><div class="row mt-s">
        <label class="field"><span>Opens</span><input id="wopen" type="datetime-local"></label>
        <label class="field"><span>Closes</span><input id="wclose" type="datetime-local"></label>
        <button class="btn" onclick="scheduleWindow()">Schedule</button></div></details>`:""}`;
  } else if(w.status==="vote"){
    const votes=w.votes||[]; const yes=votes.filter(v=>v.yes).length, mine=m&&votes.find(v=>v.manager_id===m.mid);
    head=`<p><b>${name(w.called_by)}</b> called a vote to open the trade window. ${yes} of ${D.managers.length} say yes; it needs more than ${rules.votePct??50}%. Closes ${sydTime(w.vote_closes_at)}.</p>
      <div class="votes">${D.managers.map(x=>{const v=votes.find(y=>y.manager_id===x.id);return `<span class="chip">${esc(x.name)}: <b>${v?(v.yes?"Yes":"No"):"Not yet"}</b></span>`;}).join("")}</div>
      ${m?`<div class="row mt-s"><button class="btn ${mine&&mine.yes?"":"btn-primary"}" onclick="lgAct('cast_vote',{p_window:${w.id},p_yes:true})">Vote yes</button>
        <button class="btn" onclick="lgAct('cast_vote',{p_window:${w.id},p_yes:false})">Vote no</button></div>`:""}
      ${c?`<button class="btn btn-sm btn-quiet mt-s" onclick="commishAct('commish_end_window')">Cancel the vote</button>`:""}`;
  } else if(w.status==="scheduled"){
    head=`<p>The commissioner has a trade window booked: opens ${sydTime(w.opens_at)}, closes ${sydTime(w.closes_at)}.</p>
      ${c?`<button class="btn btn-sm btn-quiet" onclick="commishAct('commish_end_window')">Cancel it</button>`:""}`;
  } else {
    head=`<p><span class="livetag tagline">Open</span> until ${sydTime(w.closes_at)}. Lineups are locked until then. New players score from the first round after it closes; points already won stay with whoever owned the player.</p>
      ${c?`<p class="small muted mt-s">The window auction opens a room with a new code. Managers join with their league names. ${m?"You bid from your own seat.":"Sign in as a manager first if you want to bid too."}</p>
        <div class="row mt-s"><button class="btn btn-primary" onclick="startWindowAuction(${w.id})">Run the window auction</button>
        <button class="btn btn-quiet" onclick="if(confirm('Close the window now?'))commishAct('commish_end_window')">Close the window now</button></div>`:""}`;
  }
  const trades=D.trades.filter(t=>w&&t.window_id===w.id);
  const tradeRow=t=>{
    const list=ids=>ids.map(p=>esc(lgP(D,p).name)).join(", ")||"nothing";
    const vetoable=c&&t.status==="accepted"&&Date.parse(t.veto_until)>Date.now();
    return `<li class="trade"><span><b>${name(t.from_mgr)}</b> gives ${list(t.give)}${+t.cash?" and "+money(+t.cash):""} to <b>${name(t.to_mgr)}</b> for ${list(t.get)}.</span>
      <span class="tagline">${t.status}${t.status==="accepted"&&t.veto_until?", veto until "+sydTime(t.veto_until):""}</span>
      ${m&&t.status==="pending"&&t.to_mgr===m.mid?`<span class="row"><button class="btn btn-sm btn-primary" onclick="lgAct('respond_trade',{p_trade:${t.id},p_accept:true})">Accept</button><button class="btn btn-sm" onclick="lgAct('respond_trade',{p_trade:${t.id},p_accept:false})">Reject</button></span>`:""}
      ${m&&t.status==="pending"&&t.from_mgr===m.mid?`<button class="btn btn-sm btn-quiet" onclick="lgAct('respond_trade',{p_trade:${t.id},p_accept:false})">Withdraw</button>`:""}
      ${vetoable?`<button class="btn btn-sm btn-danger" onclick="if(confirm('Veto this trade and put everything back?'))commishAct('commish_veto',{p_trade:${t.id}})">Veto</button>`:""}</li>`;
  };

  const mine=m?squadNow(D,m.mid):[];
  return `<section class="panel stack"><h2>Trade window</h2>${head}
    <p class="small muted">Rules: releases refund ${rules.refundPct??68}% of the price paid, to the nearest 0.25. The commissioner can veto a trade within ${rules.vetoHours??12} hours. Squad size, the overseas cap, role minimums and enough purse to fill open spots apply after every move.</p>
    ${c?`<details><summary class="small">Change the rules (commissioner)</summary><div class="rules mt-s">
      <label class="field"><span>Release refund %</span><input id="r_refund" type="number" min="0" max="100" value="${rules.refundPct??68}"></label>
      <label class="field"><span>Vote needs more than %</span><input id="r_vote" type="number" min="0" max="99" value="${rules.votePct??50}"></label>
      <label class="field"><span>Veto hours</span><input id="r_veto" type="number" min="0" max="72" value="${rules.vetoHours??12}"></label>
      <label class="field"><span>Window length, hours</span><input id="r_len" type="number" min="1" max="336" value="${rules.windowHours??72}"></label>
      <button class="btn btn-sm" onclick="saveRules()">Save rules</button></div></details>`:""}

  ${open&&m?`<section class="panel mt stack"><h3>Release a player</h3>
    <div class="row"><select id="relpid" aria-label="Player to release">${mine.map(p=>`<option value="${p}">${esc(lgP(D,p).name)}, paid ${money(pricePaid(D,m.mid,p))}, refund ${money(Math.round(pricePaid(D,m.mid,p)*(rules.refundPct??68)/100*4)/4)}</option>`).join("")}</select>
    <button class="btn" onclick="if(confirm('Release this player? They go back in the pool.'))lgAct('release_player',{p_player:parseInt(document.getElementById('relpid').value)})">Release</button></div></section>
  <section class="panel mt stack"><h3>Offer a trade</h3>${tradeForm(D,m)}</section>`:""}
  ${trades.length?`<section class="panel mt"><h3>Offers this window</h3><ul class="trades mt-s">${trades.map(tradeRow).join("")}</ul></section>`:""}`;
}
function tradeForm(D,m){
